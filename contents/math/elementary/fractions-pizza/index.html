<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피자로 배우는 분수</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .content-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .content-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .content-score {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      color: #ffd700;
    }

    .content-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: auto;
      gap: 24px;
    }

    .content-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .content-container {
        padding: 12px;
      }

      .content-title {
        font-size: 18px;
      }

      .content-score {
        font-size: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content-container">
    <header class="content-header">
      <h1 class="content-title">피자로 배우는 분수</h1>
      <div class="content-score" id="score-display">
        <span class="score-icon">&#9733;</span>
        <span id="score-value">0</span>
      </div>
    </header>

    <main class="content-main" id="main-content">
      <div class="game-area">
        <div class="question-area">
          <p class="question-text" id="question-text">피자를 <span id="target-pieces">4</span>조각으로 나눠보세요!</p>
          <p class="hint-text" id="hint-text">피자를 클릭해서 나누세요</p>
        </div>

        <div class="pizza-container">
          <div class="pizza" id="pizza">
            <div class="pizza-slice" data-slice="0"></div>
          </div>
        </div>

        <div class="fraction-display" id="fraction-display">
          <span class="fraction">
            <span class="numerator" id="numerator">1</span>
            <span class="fraction-bar"></span>
            <span class="denominator" id="denominator">1</span>
          </span>
        </div>

        <div class="controls">
          <button class="btn btn-secondary" id="btn-divide">나누기</button>
          <button class="btn btn-primary" id="btn-check">확인</button>
        </div>
      </div>

      <div class="level-indicator">
        <span>레벨 <span id="current-level">1</span> / 5</span>
      </div>
    </main>

    <footer class="content-footer">
      <button class="btn btn-secondary" id="btn-reset">다시 시작</button>
      <button class="btn btn-primary" id="btn-next" disabled>다음 문제</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
