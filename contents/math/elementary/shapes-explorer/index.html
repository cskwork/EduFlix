<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도형 탐험가</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .content-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .content-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .content-score {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      color: #ffd700;
    }

    .content-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: auto;
      gap: 24px;
    }

    .content-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .content-container {
        padding: 12px;
      }

      .content-title {
        font-size: 18px;
      }

      .content-score {
        font-size: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content-container">
    <header class="content-header">
      <h1 class="content-title">도형 탐험가</h1>
      <div class="content-score" id="score-display">
        <span class="score-icon">&#9733;</span>
        <span id="score-value">0</span>
      </div>
    </header>

    <main class="content-main" id="main-content">
      <div class="exploration-area">
        <div class="shape-tabs">
          <button class="tab-btn active" data-tab="plane">평면도형</button>
          <button class="tab-btn" data-tab="solid">입체도형</button>
        </div>

        <div class="shape-display" id="shape-display">
          <canvas id="shape-canvas" width="300" height="300"></canvas>
        </div>

        <div class="shape-info" id="shape-info">
          <h3 class="shape-name" id="shape-name">삼각형</h3>
          <div class="shape-properties" id="shape-properties">
            <div class="property">
              <span class="property-label">변</span>
              <span class="property-value" id="prop-sides">3</span>
            </div>
            <div class="property">
              <span class="property-label">꼭짓점</span>
              <span class="property-value" id="prop-vertices">3</span>
            </div>
            <div class="property">
              <span class="property-label">내각의 합</span>
              <span class="property-value" id="prop-angles">180도</span>
            </div>
          </div>
          <p class="shape-description" id="shape-description">세 개의 변과 세 개의 꼭짓점으로 이루어진 가장 기본적인 다각형입니다.</p>
        </div>

        <div class="shape-selector" id="shape-selector">
          <button class="shape-btn active" data-shape="triangle">삼각형</button>
          <button class="shape-btn" data-shape="square">사각형</button>
          <button class="shape-btn" data-shape="pentagon">오각형</button>
          <button class="shape-btn" data-shape="hexagon">육각형</button>
          <button class="shape-btn" data-shape="circle">원</button>
        </div>

        <div class="controls">
          <button class="btn btn-secondary" id="btn-rotate">회전</button>
          <button class="btn btn-primary" id="btn-quiz">퀴즈 풀기</button>
        </div>
      </div>

      <div class="quiz-area hidden" id="quiz-area">
        <h3 class="quiz-question" id="quiz-question">이 도형의 변의 개수는?</h3>
        <div class="quiz-options" id="quiz-options"></div>
        <div class="quiz-feedback hidden" id="quiz-feedback"></div>
      </div>

      <div class="progress-indicator">
        <span>탐험한 도형 <span id="explored-count">1</span> / <span id="total-shapes">10</span></span>
      </div>
    </main>

    <footer class="content-footer">
      <button class="btn btn-secondary" id="btn-back">탐험으로</button>
      <button class="btn btn-primary" id="btn-next" disabled>다음 도형</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
