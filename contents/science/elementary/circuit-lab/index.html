<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전기회로 실험실</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .content-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .content-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .content-score {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      color: #ffd700;
    }

    .content-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: auto;
      gap: 20px;
    }

    .content-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .content-container {
        padding: 12px;
      }

      .content-title {
        font-size: 18px;
      }

      .content-score {
        font-size: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content-container">
    <header class="content-header">
      <h1 class="content-title">전기회로 실험실</h1>
      <div class="content-score" id="score-display">
        <span class="score-icon">&#9733;</span>
        <span id="score-value">0</span>
      </div>
    </header>

    <main class="content-main" id="main-content">
      <div class="lab-area">
        <div class="mission-badge" id="mission-badge">
          <span>미션 <span id="current-mission">1</span></span>
          <span class="mission-title" id="mission-title">전구 켜기</span>
        </div>

        <div class="circuit-board" id="circuit-board">
          <canvas id="circuit-canvas" width="400" height="300"></canvas>
          <div class="circuit-components" id="circuit-components"></div>
        </div>

        <div class="mission-description" id="mission-description">
          전지와 전구를 연결하여 전구를 켜보세요!
        </div>

        <div class="toolbox" id="toolbox">
          <div class="tool-category">
            <span class="category-label">부품</span>
            <div class="tool-items">
              <button class="tool-btn" data-component="battery" title="전지">
                <span class="tool-icon">&#128267;</span>
                <span class="tool-name">전지</span>
              </button>
              <button class="tool-btn" data-component="bulb" title="전구">
                <span class="tool-icon">&#128161;</span>
                <span class="tool-name">전구</span>
              </button>
              <button class="tool-btn" data-component="switch" title="스위치">
                <span class="tool-icon">&#9211;</span>
                <span class="tool-name">스위치</span>
              </button>
              <button class="tool-btn" data-component="wire" title="전선">
                <span class="tool-icon">&#10145;</span>
                <span class="tool-name">전선</span>
              </button>
            </div>
          </div>
        </div>

        <div class="circuit-info" id="circuit-info">
          <div class="info-item">
            <span class="info-label">전류</span>
            <span class="info-value" id="current-flow">0 A</span>
          </div>
          <div class="info-item">
            <span class="info-label">전압</span>
            <span class="info-value" id="voltage">0 V</span>
          </div>
          <div class="info-item">
            <span class="info-label">상태</span>
            <span class="info-value" id="circuit-status">미완성</span>
          </div>
        </div>
      </div>

      <div class="progress-indicator">
        <span>미션 <span id="mission-progress">1</span> / <span id="total-missions">5</span></span>
      </div>
    </main>

    <footer class="content-footer">
      <button class="btn btn-secondary" id="btn-clear">초기화</button>
      <button class="btn btn-primary" id="btn-check">회로 확인</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
