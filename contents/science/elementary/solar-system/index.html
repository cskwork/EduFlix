<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태양계 여행</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at bottom, #1a1a2e 0%, #0d0d1a 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .content-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      position: relative;
      z-index: 100;
    }

    .content-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .content-score {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      color: #ffd700;
    }

    .content-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .content-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
      position: relative;
      z-index: 100;
    }

    @media (max-width: 768px) {
      .content-container {
        padding: 12px;
      }

      .content-title {
        font-size: 18px;
      }

      .content-score {
        font-size: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content-container">
    <header class="content-header">
      <h1 class="content-title">태양계 여행</h1>
      <div class="content-score" id="score-display">
<img src="images/star.png" class="score-icon" alt="score" width="24" height="24">
        <span id="planets-visited">0</span> / 8 행성
      </div>
    </header>

    <main class="content-main" id="main-content">
      <div class="stars" id="stars"></div>

      <div class="solar-system" id="solar-system">
        <div class="sun" id="sun">
          <span class="sun-label">태양</span>
        </div>

        <div class="orbit" data-planet="mercury">
          <div class="planet mercury" id="mercury" data-name="수성">
            <span class="planet-label">수성</span>
          </div>
        </div>

        <div class="orbit" data-planet="venus">
          <div class="planet venus" id="venus" data-name="금성">
            <span class="planet-label">금성</span>
          </div>
        </div>

        <div class="orbit" data-planet="earth">
          <div class="planet earth" id="earth" data-name="지구">
            <span class="planet-label">지구</span>
          </div>
        </div>

        <div class="orbit" data-planet="mars">
          <div class="planet mars" id="mars" data-name="화성">
            <span class="planet-label">화성</span>
          </div>
        </div>

        <div class="orbit" data-planet="jupiter">
          <div class="planet jupiter" id="jupiter" data-name="목성">
            <span class="planet-label">목성</span>
          </div>
        </div>

        <div class="orbit" data-planet="saturn">
          <div class="planet saturn" id="saturn" data-name="토성">
            <span class="planet-label">토성</span>
            <div class="saturn-ring"></div>
          </div>
        </div>

        <div class="orbit" data-planet="uranus">
          <div class="planet uranus" id="uranus" data-name="천왕성">
            <span class="planet-label">천왕성</span>
          </div>
        </div>

        <div class="orbit" data-planet="neptune">
          <div class="planet neptune" id="neptune" data-name="해왕성">
            <span class="planet-label">해왕성</span>
          </div>
        </div>
      </div>

      <div class="info-panel" id="info-panel">
        <button class="close-btn" id="close-panel">&times;</button>
        <h2 class="info-title" id="info-title">행성을 클릭하세요</h2>
        <div class="info-content" id="info-content">
          <p>태양계의 행성을 클릭하여 자세한 정보를 확인하세요!</p>
        </div>
        <div class="info-facts" id="info-facts"></div>
      </div>

      <div class="spaceship" id="spaceship">
        <span>&#128640;</span>
      </div>
    </main>

    <footer class="content-footer">
      <button class="btn btn-secondary" id="btn-reset">처음부터</button>
      <button class="btn btn-primary" id="btn-quiz">퀴즈 풀기</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
