<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화학 반응 시뮬레이터</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .content-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .content-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .content-score {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      color: #ffd700;
    }

    .content-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: auto;
      gap: 16px;
    }

    .content-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .content-container {
        padding: 12px;
      }

      .content-title {
        font-size: 18px;
      }

      .content-score {
        font-size: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content-container">
    <header class="content-header">
      <h1 class="content-title">화학 반응 시뮬레이터</h1>
      <div class="content-score" id="score-display">
        <span class="score-icon">&#9733;</span>
        <span id="score-value">0</span>
      </div>
    </header>

    <main class="content-main" id="main-content">
      <div class="simulation-area">
        <div class="reaction-badge" id="reaction-badge">
          <span>실험 <span id="current-experiment">1</span></span>
          <span class="reaction-type" id="reaction-type">연소 반응</span>
        </div>

        <div class="reaction-container">
          <div class="beaker left" id="beaker-left">
            <div class="beaker-liquid" id="liquid-left"></div>
            <div class="beaker-label" id="label-left">반응물</div>
          </div>

          <div class="reaction-arrow" id="reaction-arrow">
            <span class="arrow">&#10145;</span>
            <button class="react-btn" id="btn-react">반응 시작</button>
          </div>

          <div class="beaker right" id="beaker-right">
            <div class="beaker-liquid" id="liquid-right"></div>
            <div class="beaker-label" id="label-right">생성물</div>
          </div>
        </div>

        <div class="equation-display" id="equation-display">
          <div class="equation-part reactants" id="reactants">
            <span class="molecule" data-mol="CH4">CH<sub>4</sub></span>
            <span class="plus">+</span>
            <span class="molecule" data-mol="O2">2O<sub>2</sub></span>
          </div>
          <span class="reaction-symbol">&#10145;</span>
          <div class="equation-part products" id="products">
            <span class="molecule" data-mol="CO2">CO<sub>2</sub></span>
            <span class="plus">+</span>
            <span class="molecule" data-mol="H2O">2H<sub>2</sub>O</span>
          </div>
        </div>

        <div class="reaction-info" id="reaction-info">
          <h3 class="reaction-name" id="reaction-name">메탄의 연소</h3>
          <p class="reaction-description" id="reaction-description">메탄(CH4)이 산소(O2)와 반응하여 이산화탄소(CO2)와 물(H2O)을 생성합니다.</p>
          <div class="reaction-properties">
            <div class="property">
              <span class="property-label">반응 유형</span>
              <span class="property-value" id="prop-type">발열 반응</span>
            </div>
            <div class="property">
              <span class="property-label">에너지</span>
              <span class="property-value" id="prop-energy">열 방출</span>
            </div>
          </div>
        </div>

        <div class="balance-challenge hidden" id="balance-challenge">
          <h4>반응식 균형 맞추기</h4>
          <div class="balance-equation" id="balance-equation">
            <input type="number" class="coef-input" id="coef-1" value="1" min="1" max="9">
            <span class="molecule">H<sub>2</sub></span>
            <span class="plus">+</span>
            <input type="number" class="coef-input" id="coef-2" value="1" min="1" max="9">
            <span class="molecule">O<sub>2</sub></span>
            <span class="arrow">&#10145;</span>
            <input type="number" class="coef-input" id="coef-3" value="1" min="1" max="9">
            <span class="molecule">H<sub>2</sub>O</span>
          </div>
          <button class="btn btn-primary" id="btn-check-balance">확인</button>
          <div class="balance-feedback hidden" id="balance-feedback"></div>
        </div>

        <div class="experiment-selector" id="experiment-selector">
          <button class="exp-btn active" data-exp="combustion">연소</button>
          <button class="exp-btn" data-exp="neutralization">중화</button>
          <button class="exp-btn" data-exp="decomposition">분해</button>
          <button class="exp-btn" data-exp="synthesis">합성</button>
        </div>
      </div>

      <div class="progress-indicator">
        <span>완료한 실험 <span id="completed-count">0</span> / <span id="total-experiments">4</span></span>
      </div>
    </main>

    <footer class="content-footer">
      <button class="btn btn-secondary" id="btn-reset">초기화</button>
      <button class="btn btn-primary" id="btn-challenge">균형 맞추기</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
