<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태양계 여행</title>
  <link rel="stylesheet" href="../../../common/style.css">
  <style>
    /* Solar System Specific Styles */
    .solar-system-stage {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #0B0B2A, black);
        position: relative;
        overflow: hidden;
    }
    
    .planet {
        position: absolute;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.3s;
        box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    
    .planet:hover {
        transform: scale(1.2);
        z-index: 100;
    }
    
    .planet-label {
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 12px;
        pointer-events: none;
        white-space: nowrap;
    }
    
    .spaceship {
        position: absolute;
        width: 40px;
        height: 40px;
        font-size: 30px;
        transition: all 1s ease-in-out;
        z-index: 50;
        pointer-events: none;
    }
    
    .info-panel {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 300px;
        background: rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 20px;
        border-radius: 10px;
        transform: translateY(150%);
        transition: transform 0.3s;
    }
    
    .info-panel.active {
        transform: translateY(0);
    }
    
    /* Stars */
    .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  <script src="../../../common/engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
