<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전기회로 실험실</title>
  <link rel="stylesheet" href="../../../common/style.css">
  <style>
    /* Circuit Specific */
    .circuit-container {
        width: 100%;
        height: 350px;
        background: #2a2a2a;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        margin-top: 20px;
    }
    
    .component {
        position: absolute;
        cursor: grab;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 80px;
        height: 80px;
        justify-content: center;
        background: rgba(255,255,255,0.1);
        border: 2px solid #555;
        border-radius: 8px;
        transition: border-color 0.2s;
    }
    
    .component:hover {
        border-color: #ffd700;
    }
    
    .component-icon {
        font-size: 40px;
        pointer-events: none;
    }
    
    .component-label {
        font-size: 12px;
        color: #ddd;
        margin-top: 5px;
        pointer-events: none;
    }
    
    .bulb.on .component-icon {
        text-shadow: 0 0 20px yellow;
        filter: drop-shadow(0 0 10px yellow);
    }
    
    .wire {
        position: absolute;
        height: 4px;
        background: #ff5722;
        transform-origin: 0 50%;
        pointer-events: none;
        z-index: 10;
    }
    
    .toolbar {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        justify-content: center;
    }
    
    .tool-btn {
        padding: 10px 20px;
        background: #444;
        border: 1px solid #666;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }
    
    .tool-btn:hover {
        background: #555;
    }

    #connection-mode-indicator {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 5px 10px;
        background: rgba(0,0,0,0.5);
        color: #4caf50;
        border-radius: 4px;
        display: none;
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  <script src="../../../common/engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
