<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화학 반응 시뮬레이터</title>
  <link rel="stylesheet" href="../../../common/style.css">
  <style>
    /* Reactor Specific Styles */
    .lab-bench {
        width: 100%;
        height: 350px;
        background: #e0e0e0;
        position: relative;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 20px;
        overflow: hidden;
    }
    
    .beaker {
        width: 150px;
        height: 200px;
        border: 4px solid #aaa;
        border-top: none;
        background: rgba(255,255,255,0.2);
        position: relative;
        margin: 0 20px;
        border-radius: 0 0 20px 20px;
        overflow: hidden;
    }
    
    .liquid {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 50%;
        background: #aadaff;
        transition: background-color 1s, height 0.5s;
    }
    
    .bubbles {
         position: absolute;
         width: 100%;
         height: 100%;
         bottom: 0;
         display: none;
    }
    
    .bubble {
        position: absolute;
        background: rgba(255,255,255,0.5);
        border-radius: 50%;
        animation: rise 2s infinite;
    }
    
    @keyframes rise {
        0% { bottom: 0; opacity: 0; }
        50% { opacity: 1; }
        100% { bottom: 100%; opacity: 0; }
    }
    
    .shelf {
        position: absolute;
        top: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 15px;
    }
    
    .reagent {
        width: 60px;
        height: 80px;
        background: #fff;
        border: 1px solid #999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }
    
    .reagent:hover { transform: translateY(-5px); }
    
    .reagent-cap { width: 40px; height: 10px; background: #333; margin-bottom: 5px; }
    .reagent-bottle { width: 50px; height: 60px; background: inherit; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    
    .reagent.acid .reagent-bottle { color: red; }
    .reagent.base .reagent-bottle { color: blue; }
    .reagent.indicator .reagent-bottle { color: purple; }
    
    .reaction-info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(255,255,255,0.9);
        padding: 5px 10px;
        border-radius: 4px;
        color: black;
        font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  <script src="../../../common/engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
