<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시간 여행 자산 시뮬레이터: 30년 뒤 나의 지갑은?</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../common/mobile.css">
</head>
<body>
  <div id="scene-container">
    <div id="progress-bar-container" role="progressbar" aria-label="학습 진행도" aria-valuenow="1" aria-valuemin="1" aria-valuemax="5">
      <div class="progress-track"></div>
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-dots">
        <span class="progress-dot active">1</span>
        <span class="progress-dot">2</span>
        <span class="progress-dot">3</span>
        <span class="progress-dot">4</span>
        <span class="progress-dot">5</span>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
