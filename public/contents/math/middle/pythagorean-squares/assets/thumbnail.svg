<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#1a1a2e"/>
  <!-- Triangle -->
  <path d="M40,160 L40,60 L140,160 Z" fill="none" stroke="#4fc3f7" stroke-width="3"/>
  <!-- Square a -->
  <rect x="10" y="60" width="30" height="100" fill="#e91e63" opacity="0.6"/>
  <!-- Square b -->
  <rect x="40" y="160" width="100" height="30" fill="#4caf50" opacity="0.6"/>
  <!-- Square c (rotated) -->
  <g transform="rotate(-45 90 110)">
    <rect x="55" y="60" width="70" height="70" fill="#2196f3" opacity="0.4" stroke="#64b5f6" stroke-width="2"/>
  </g>
  <!-- Formula -->
  <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">a² + b² = c²</text>
</svg>
