<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- 좌표축 -->
  <g transform="translate(200, 180)">
    <!-- X축 (빨강) -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#E91E63" stroke-width="3"/>
    <polygon points="100,0 90,-5 90,5" fill="#E91E63"/>
    <text x="110" y="5" fill="#E91E63" font-size="16" font-weight="bold">X</text>

    <!-- Y축 (초록) -->
    <line x1="0" y1="60" x2="0" y2="-80" stroke="#4CAF50" stroke-width="3"/>
    <polygon points="0,-80 -5,-70 5,-70" fill="#4CAF50"/>
    <text x="10" y="-85" fill="#4CAF50" font-size="16" font-weight="bold">Y</text>

    <!-- Z축 (파랑) -->
    <line x1="-60" y1="40" x2="60" y2="-40" stroke="#2196F3" stroke-width="3"/>
    <polygon points="60,-40 48,-38 52,-50" fill="#2196F3"/>
    <text x="70" y="-45" fill="#2196F3" font-size="16" font-weight="bold">Z</text>

    <!-- 원점 -->
    <circle cx="0" cy="0" r="6" fill="#fff"/>
  </g>

  <!-- 드론 -->
  <g transform="translate(250, 100)">
    <rect x="-20" y="-5" width="40" height="10" rx="3" fill="#444"/>
    <circle cx="-15" cy="-5" r="10" fill="#64B5F6" opacity="0.5"/>
    <circle cx="15" cy="-5" r="10" fill="#64B5F6" opacity="0.5"/>
    <circle cx="0" cy="-10" r="4" fill="#4CAF50"/>
  </g>

  <!-- 좌표 표시 -->
  <text x="260" y="130" fill="#fff" font-size="14">(3, 2, 4)</text>

  <!-- 제목 -->
  <text x="200" y="45" text-anchor="middle" fill="#fff" font-size="26" font-weight="bold">3D 좌표계: 드론 파일럿</text>
  <text x="200" y="275" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14">x, y, z 좌표로 드론을 조종하자!</text>
</svg>
