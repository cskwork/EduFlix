<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- 직육면체 (와이어프레임) -->
  <g transform="translate(120, 80)">
    <!-- 앞면 -->
    <path d="M0 80 L120 80 L120 160 L0 160 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- 윗면 -->
    <path d="M0 80 L60 40 L180 40 L120 80 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- 옆면 -->
    <path d="M120 80 L180 40 L180 120 L120 160 Z" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- 바닥 대각선 (노랑) -->
    <line x1="0" y1="160" x2="180" y2="120" stroke="#FFC107" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- 공간 대각선 (보라) -->
    <line x1="0" y1="160" x2="180" y2="40" stroke="#9C27B0" stroke-width="4"/>

    <!-- 꼭짓점 -->
    <circle cx="0" cy="160" r="6" fill="#E91E63"/>
    <circle cx="180" cy="40" r="6" fill="#4CAF50"/>
  </g>

  <!-- 공식 -->
  <text x="200" y="260" text-anchor="middle" fill="#fff" font-size="18">
    d = sqrt(a^2 + b^2 + c^2)
  </text>

  <!-- 제목 -->
  <text x="200" y="40" text-anchor="middle" fill="#fff" font-size="26" font-weight="bold">공간 대각선</text>
</svg>
