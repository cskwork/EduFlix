<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c0c"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <marker id="arrowhead-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E91E63"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
    <marker id="arrowhead-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFC107"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- 좌표축 -->
  <g transform="translate(150, 180)">
    <!-- X축 -->
    <line x1="-80" y1="0" x2="120" y2="0" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <!-- Y축 -->
    <line x1="0" y1="80" x2="0" y2="-80" stroke="#51cf66" stroke-width="1" opacity="0.3"/>
    <!-- Z축 -->
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#339af0" stroke-width="1" opacity="0.3"/>

    <!-- 벡터 A (빨강) -->
    <line x1="0" y1="0" x2="60" y2="-30" stroke="#E91E63" stroke-width="4" marker-end="url(#arrowhead-pink)"/>
    <text x="70" y="-25" fill="#E91E63" font-size="16" font-weight="bold">A</text>

    <!-- 벡터 B (초록) -->
    <line x1="0" y1="0" x2="30" y2="-60" stroke="#4CAF50" stroke-width="4" marker-end="url(#arrowhead-green)"/>
    <text x="35" y="-55" fill="#4CAF50" font-size="16" font-weight="bold">B</text>

    <!-- 결과 벡터 (노랑) -->
    <line x1="0" y1="0" x2="90" y2="-90" stroke="#FFC107" stroke-width="5" marker-end="url(#arrowhead-yellow)"/>
    <text x="95" y="-85" fill="#FFC107" font-size="18" font-weight="bold">A+B</text>

    <!-- 평행사변형 보조선 -->
    <line x1="60" y1="-30" x2="90" y2="-90" stroke="#4CAF50" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="30" y1="-60" x2="90" y2="-90" stroke="#E91E63" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>

    <!-- 원점 -->
    <circle cx="0" cy="0" r="5" fill="#fff"/>
  </g>

  <!-- 공식 -->
  <text x="200" y="260" text-anchor="middle" fill="#fff" font-size="16">
    A + B = (a_x + b_x, a_y + b_y, a_z + b_z)
  </text>

  <!-- 제목 -->
  <text x="200" y="40" text-anchor="middle" fill="#fff" font-size="26" font-weight="bold">3D 벡터: 힘의 합성</text>
</svg>
