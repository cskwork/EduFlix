<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- 3D 직육면체 -->
  <g transform="translate(120, 60)">
    <!-- 뒷면 -->
    <rect x="40" y="0" width="120" height="80" fill="#9575CD" stroke="#7E57C2" stroke-width="2"/>

    <!-- 윗면 -->
    <polygon points="40,0 160,0 200,30 80,30" fill="#B39DDB" stroke="#7E57C2" stroke-width="2"/>

    <!-- 앞면 -->
    <rect x="80" y="30" width="120" height="80" fill="#EDE7F6" stroke="#7E57C2" stroke-width="2"/>

    <!-- 오른쪽 면 -->
    <polygon points="200,30 200,110 160,80 160,0" fill="#D1C4E9" stroke="#7E57C2" stroke-width="2"/>

    <!-- 격자선 (단위 큐브 표시) -->
    <g stroke="#9575CD" stroke-width="1" stroke-dasharray="3,3">
      <line x1="110" y1="30" x2="110" y2="110"/>
      <line x1="140" y1="30" x2="140" y2="110"/>
      <line x1="170" y1="30" x2="170" y2="110"/>
      <line x1="80" y1="50" x2="200" y2="50"/>
      <line x1="80" y1="70" x2="200" y2="70"/>
      <line x1="80" y1="90" x2="200" y2="90"/>
    </g>
  </g>

  <!-- 치수 표시 -->
  <g fill="#fff" font-size="14" font-weight="bold">
    <text x="230" y="200">가로</text>
    <text x="290" y="180">세로</text>
    <text x="330" y="130">높이</text>
  </g>

  <!-- 수식 -->
  <text x="200" y="250" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">
    부피 = 가로 x 세로 x 높이
  </text>

  <!-- 제목 -->
  <text x="200" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">직육면체의 부피</text>
</svg>
