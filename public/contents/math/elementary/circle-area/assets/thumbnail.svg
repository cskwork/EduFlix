<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#FFE66D"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- 피자 원 -->
  <g transform="translate(200, 140)">
    <!-- 피자 베이스 -->
    <circle r="80" fill="#FFC107" stroke="#FF9800" stroke-width="3"/>

    <!-- 피자 조각 분할선 -->
    <g stroke="#E65100" stroke-width="2">
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <line x1="-57" y1="-57" x2="57" y2="57"/>
      <line x1="57" y1="-57" x2="-57" y2="57"/>
    </g>

    <!-- 토핑 (점) -->
    <g fill="#D32F2F">
      <circle cx="-30" cy="-40" r="8"/>
      <circle cx="35" cy="-25" r="7"/>
      <circle cx="20" cy="35" r="8"/>
      <circle cx="-40" cy="20" r="6"/>
      <circle cx="0" cy="-20" r="7"/>
      <circle cx="-25" cy="45" r="6"/>
      <circle cx="50" cy="10" r="7"/>
    </g>

    <!-- 반지름 표시 -->
    <line x1="0" y1="0" x2="70" y2="-40" stroke="#fff" stroke-width="3"/>
    <text x="45" y="-25" fill="#fff" font-size="14" font-weight="bold">r</text>
  </g>

  <!-- 수식 -->
  <text x="200" y="255" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">
    넓이 = π x r x r
  </text>

  <!-- 제목 -->
  <text x="200" y="35" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">원의 넓이</text>
</svg>
