<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도리와 대칭 박물관 복원 작전</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../common/mobile.css">
</head>
<body>
  <header class="sr-only">
    <h1>도리와 대칭 박물관 복원 작전</h1>
    <p>학습목표: 도형을 접거나 반 바퀴 돌렸을 때 겹치는 모습을 관찰하여 선대칭과 점대칭을 구별하고, 대응점을 찾아 도형을 완성할 수 있습니다.</p>
  </header>
  <main id="scene-container" aria-label="대칭 박물관 학습 활동">
    <figure class="hook-thumbnail" aria-labelledby="hook-thumbnail-caption">
      <img src="thumbnail.png" alt="안내 로봇 도리가 나비의 접기와 바람개비의 반 바퀴 회전을 살펴보는 대칭 박물관">
      <figcaption id="hook-thumbnail-caption">접기와 반 바퀴 돌리기로 대칭 박물관을 복원해요.</figcaption>
    </figure>
  </main>
  <script src="script.js"></script>
</body>
</html>
