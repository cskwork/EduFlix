<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 산 3D | 동아출판 수학</title>
    <meta name="description" content="3D 산을 오르며 구구단을 마스터하세요! 재미있는 게이미피케이션으로 곱셈을 배워요.">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --secondary: #8b5cf6;
            --accent: #fbbf24;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0c4a6e 0%, #0e7490 50%, #06b6d4 100%);
            color: #fff;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Top bar */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
        }

        .stat-box {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 14px 24px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-2px);
        }

        .stat-box .icon {
            font-size: 24px;
        }

        .stat-box .value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
        }

        /* Times table grid */
        #table-selector {
            position: absolute;
            top: 100px;
            left: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            pointer-events: auto;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #table-selector h3 {
            color: #fff;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .table-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: rgba(6, 182, 212, 0.3);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .table-btn:hover {
            transform: scale(1.1);
            background: rgba(6, 182, 212, 0.5);
        }

        .table-btn.current {
            background: linear-gradient(135deg, var(--accent) 0%, #f59e0b 100%);
            color: var(--dark);
            border-color: var(--accent);
            transform: scale(1.1);
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.5);
        }

        .table-btn.mastered {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border-color: var(--success);
        }

        .table-btn.mastered::after {
            content: '✓';
            position: absolute;
            font-size: 10px;
            bottom: 2px;
            right: 4px;
        }

        /* Progress indicator */
        #progress-panel {
            position: absolute;
            top: 100px;
            right: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 20px;
            pointer-events: auto;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-width: 250px;
        }

        #progress-panel h3 {
            color: var(--accent);
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mountain-progress {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            transition: all 0.3s;
        }

        .progress-step.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.3) 0%, rgba(139, 92, 246, 0.3) 100%);
            border: 1px solid var(--primary);
        }

        .progress-step.completed {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3) 0%, rgba(5, 150, 105, 0.3) 100%);
        }

        .progress-step .step-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .progress-step.active .step-num {
            background: var(--primary);
        }

        .progress-step.completed .step-num {
            background: var(--success);
        }

        .progress-step .step-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Main game area */
        #game-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
        }

        #problem-display {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px 60px;
            border-radius: 30px;
            margin-bottom: 24px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        #problem-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .number {
            font-size: 72px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .operator-symbol {
            font-size: 56px;
            color: #fff;
            font-weight: 900;
        }

        .equals-symbol {
            font-size: 56px;
            color: var(--success);
            font-weight: 900;
        }

        .question-mark {
            font-size: 72px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 900;
        }

        #answer-input {
            width: 160px;
            height: 80px;
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            border: 4px solid var(--glass-border);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark);
            transition: all 0.3s;
        }

        #answer-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
        }

        #submit-btn {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border: none;
            border-radius: 20px;
            padding: 20px 50px;
            color: white;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
        }

        #submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.6);
        }

        #submit-btn:active {
            transform: scale(0.98);
        }

        /* Streak and bonus display */
        #streak-display {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(245, 158, 11, 0.2) 100%);
            border: 2px solid var(--accent);
            padding: 16px 40px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3);
            pointer-events: auto;
        }

        .streak-item {
            text-align: center;
        }

        .streak-item .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
        }

        .streak-item .value {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
        }

        /* Feedback */
        #feedback-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.3s;
        }

        #feedback-message.show {
            opacity: 1;
            animation: feedbackPop 0.5s ease;
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Power ups */
        #power-ups {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .power-up {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .power-up:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .power-up .icon {
            font-size: 24px;
        }

        .power-up .count {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
        }

        .power-up.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Start screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0c4a6e 0%, #0e7490 50%, #06b6d4 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            overflow: hidden;
        }

        .floating-clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            font-size: 80px;
            opacity: 0.2;
            animation: floatCloud 30s linear infinite;
        }

        @keyframes floatCloud {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        #start-screen h1 {
            font-size: clamp(40px, 8vw, 72px);
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            text-align: center;
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4)); }
            to { filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.6)); }
        }

        #start-screen .subtitle {
            font-size: clamp(16px, 3vw, 22px);
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 48px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            padding: 0 20px;
        }

        #start-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #f59e0b 100%);
            border: none;
            border-radius: 50px;
            padding: 22px 64px;
            color: var(--dark);
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(251, 191, 36, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #start-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 60px rgba(251, 191, 36, 0.7);
        }

        .features {
            display: flex;
            gap: 40px;
            margin-top: 60px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .feature {
            text-align: center;
            max-width: 180px;
        }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .feature-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Climber indicator */
        #climber-indicator {
            position: absolute;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Celebration effects */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 1000;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            #table-selector, #progress-panel {
                display: none;
            }

            .number {
                font-size: 48px;
            }

            .operator-symbol, .equals-symbol {
                font-size: 36px;
            }

            .question-mark {
                font-size: 48px;
            }

            #answer-input {
                width: 120px;
                height: 60px;
                font-size: 36px;
            }

            #problem-display {
                padding: 30px 40px;
            }

            #streak-display {
                padding: 12px 24px;
                gap: 20px;
            }

            .streak-item .value {
                font-size: 22px;
            }

            #power-ups {
                bottom: auto;
                top: 100px;
                right: 10px;
            }

            .power-up {
                width: 50px;
                height: 50px;
            }

            .stat-box {
                padding: 10px 14px;
                font-size: 13px;
            }

            #top-bar {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>

        <div id="ui-overlay">
            <div id="top-bar">
                <div class="stat-box">
                    <span class="icon">⛰️</span>
                    <span>구구단</span>
                    <span class="value" id="current-table">2단</span>
                </div>
                <div class="stat-box">
                    <span class="icon">⭐</span>
                    <span>점수</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="icon">🏆</span>
                    <span>마스터</span>
                    <span class="value"><span id="mastered-count">0</span>/9</span>
                </div>
            </div>

            <div id="table-selector">
                <h3>⛰️ 산 선택</h3>
                <div class="table-grid" id="table-grid"></div>
            </div>

            <div id="progress-panel">
                <h3>🚶 등반 진행</h3>
                <div class="mountain-progress" id="mountain-progress"></div>
            </div>

            <div id="game-area">
                <div id="problem-display">
                    <div id="problem-text">
                        <span class="number" id="num1">2</span>
                        <span class="operator-symbol">×</span>
                        <span class="number" id="num2">1</span>
                        <span class="equals-symbol">=</span>
                        <span class="question-mark">?</span>
                    </div>
                    <input type="number" id="answer-input" placeholder="?" autocomplete="off">
                </div>
                <button id="submit-btn">
                    <span>✓ 정답 확인</span>
                </button>
            </div>

            <div id="streak-display">
                <div class="streak-item">
                    <div class="label">연속 정답</div>
                    <div class="value">🔥 <span id="streak">0</span></div>
                </div>
                <div class="streak-item">
                    <div class="label">최고 기록</div>
                    <div class="value">👑 <span id="max-streak">0</span></div>
                </div>
                <div class="streak-item">
                    <div class="label">현재 위치</div>
                    <div class="value">📍 <span id="position">1</span>/9</div>
                </div>
            </div>

            <div id="power-ups">
                <div class="power-up" id="power-skip" title="건너뛰기">
                    <span class="icon">⏭️</span>
                    <span class="count" id="skip-count">3</span>
                </div>
                <div class="power-up" id="power-hint" title="힌트">
                    <span class="icon">💡</span>
                    <span class="count" id="hint-count">3</span>
                </div>
                <div class="power-up" id="power-freeze" title="시간 정지">
                    <span class="icon">❄️</span>
                    <span class="count" id="freeze-count">2</span>
                </div>
            </div>

            <div id="climber-indicator">🧗</div>
        </div>

        <div id="feedback-message"></div>

        <div id="start-screen">
            <div class="floating-clouds">
                <div class="cloud" style="top: 10%; animation-delay: 0s;">☁️</div>
                <div class="cloud" style="top: 30%; animation-delay: 5s;">☁️</div>
                <div class="cloud" style="top: 50%; animation-delay: 10s;">☁️</div>
                <div class="cloud" style="top: 70%; animation-delay: 15s;">☁️</div>
            </div>
            <h1>⛰️ 구구단 산 3D</h1>
            <p class="subtitle">구구단 산을 정복하세요! 2단부터 9단까지 모든 산을 오르면 구구단 마스터가 됩니다!</p>
            <button id="start-btn">
                <span>등반 시작!</span>
                <span>🚀</span>
            </button>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🏔️</div>
                    <div class="feature-title">9개의 산</div>
                    <div class="feature-desc">2단부터 9단까지 정복하세요</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔥</div>
                    <div class="feature-title">연속 보너스</div>
                    <div class="feature-desc">연속으로 맞추면 점수 UP!</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-title">파워업</div>
                    <div class="feature-desc">힌트와 건너뛰기를 활용하세요</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
    <script>
        // Game state
        let currentTable = 2;
        let currentMultiplier = 1;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let masteredTables = new Set();
        let gameStarted = false;
        let correctCount = 0;
        let totalAttempts = 0;

        // Power-ups
        let powerUps = {
            skip: 3,
            hint: 3,
            freeze: 2
        };

        // Three.js
        let scene, camera, renderer;
        let mountains = [];
        let clouds = [];
        let snowflakes = [];
        let climber = null;
        let sunLight, atmosphereLight;

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 40);
            camera.lookAt(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setupLighting();
            createMountainRange();
            createClouds();
            createSnowflakes();
            createClimber();
            createGround();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLighting() {
            // Ambient sky light
            const ambient = new THREE.AmbientLight(0x87ceeb, 0.4);
            scene.add(ambient);

            // Sun
            sunLight = new THREE.DirectionalLight(0xffd700, 1.2);
            sunLight.position.set(50, 50, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 100;
            sunLight.shadow.camera.left = -30;
            sunLight.shadow.camera.right = 30;
            sunLight.shadow.camera.top = 30;
            sunLight.shadow.camera.bottom = -30;
            scene.add(sunLight);

            // Atmospheric rim light
            atmosphereLight = new THREE.PointLight(0x06b6d4, 0.5, 100);
            atmosphereLight.position.set(-20, 30, 20);
            scene.add(atmosphereLight);

            // Warm light from below
            const warmLight = new THREE.PointLight(0xfbbf24, 0.3, 60);
            warmLight.position.set(0, -10, 20);
            scene.add(warmLight);
        }

        function createMountainRange() {
            const mountainColors = [
                0x1e3a5f, 0x2d4a6a, 0x3d5a75, 0x4d6a80,
                0x5d7a8b, 0x6d8a96, 0x7d9aa1, 0x8daaac
            ];

            // Create 8 mountains for tables 2-9
            for (let i = 0; i < 8; i++) {
                const tableNum = i + 2;
                const height = 15 + i * 2;
                const baseRadius = 8 - i * 0.3;
                
                const mountainGeometry = new THREE.ConeGeometry(baseRadius, height, 6);
                const mountainMaterial = new THREE.MeshPhongMaterial({
                    color: mountainColors[i],
                    shininess: 20,
                    flatShading: true
                });
                
                const mountain = new THREE.Mesh(mountainGeometry, mountainMaterial);
                
                // Position mountains in a curved line
                const angle = (i - 3.5) * 0.3;
                mountain.position.set(
                    Math.sin(angle) * 25,
                    height / 2 - 8,
                    Math.cos(angle) * 10 - 20
                );
                
                mountain.castShadow = true;
                mountain.receiveShadow = true;
                mountain.userData = { tableNum, height, baseY: mountain.position.y };
                
                scene.add(mountain);
                mountains.push(mountain);

                // Snow cap
                const snowCapGeometry = new THREE.ConeGeometry(baseRadius * 0.4, height * 0.3, 6);
                const snowCapMaterial = new THREE.MeshPhongMaterial({
                    color: 0xffffff,
                    shininess: 80,
                    flatShading: true
                });
                const snowCap = new THREE.Mesh(snowCapGeometry, snowCapMaterial);
                snowCap.position.y = height / 2 - height * 0.15;
                mountain.add(snowCap);

                // Flag at top (for mastered tables)
                const flagPole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.05, 2, 8),
                    new THREE.MeshPhongMaterial({ color: 0x8b4513 })
                );
                flagPole.position.y = height / 2 + 0.5;
                flagPole.visible = false;
                mountain.add(flagPole);
                
                const flag = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.5, 1),
                    new THREE.MeshPhongMaterial({ 
                        color: 0xef4444, 
                        side: THREE.DoubleSide 
                    })
                );
                flag.position.set(0.75, 1, 0);
                flag.visible = false;
                flagPole.add(flag);
                
                mountain.userData.flagPole = flagPole;
                mountain.userData.flag = flag;
            }
        }

        function createClouds() {
            const cloudMaterial = new THREE.MeshPhongMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                flatShading: true
            });

            for (let i = 0; i < 15; i++) {
                const cloud = new THREE.Group();
                
                // Create fluffy cloud from multiple spheres
                const numPuffs = 3 + Math.floor(Math.random() * 4);
                for (let j = 0; j < numPuffs; j++) {
                    const puffGeometry = new THREE.SphereGeometry(
                        2 + Math.random() * 2,
                        8, 8
                    );
                    const puff = new THREE.Mesh(puffGeometry, cloudMaterial);
                    puff.position.set(
                        j * 1.5 - numPuffs * 0.75,
                        Math.random() * 0.5,
                        Math.random() * 1
                    );
                    puff.scale.y = 0.6;
                    cloud.add(puff);
                }

                cloud.position.set(
                    (Math.random() - 0.5) * 80,
                    15 + Math.random() * 15,
                    (Math.random() - 0.5) * 40 - 20
                );

                cloud.userData = {
                    speed: 0.005 + Math.random() * 0.01,
                    startX: cloud.position.x
                };

                scene.add(cloud);
                clouds.push(cloud);
            }
        }

        function createSnowflakes() {
            const snowGeometry = new THREE.BufferGeometry();
            const snowCount = 500;
            const positions = new Float32Array(snowCount * 3);

            for (let i = 0; i < snowCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 100;
                positions[i * 3 + 1] = Math.random() * 50;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 60 - 20;
            }

            snowGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const snowMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.15,
                transparent: true,
                opacity: 0.8
            });

            const snowSystem = new THREE.Points(snowGeometry, snowMaterial);
            snowSystem.userData = { positions };
            scene.add(snowSystem);
            snowflakes.push(snowSystem);
        }

        function createClimber() {
            climber = new THREE.Group();

            // Body
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xff6b6b });
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.5, 1.2, 8),
                bodyMaterial
            );
            body.position.y = 0.6;
            climber.add(body);

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.35, 16, 16),
                new THREE.MeshPhongMaterial({ color: 0xffdbac })
            );
            head.position.y = 1.5;
            climber.add(head);

            // Hat
            const hat = new THREE.Mesh(
                new THREE.ConeGeometry(0.4, 0.6, 8),
                new THREE.MeshPhongMaterial({ color: 0x06b6d4 })
            );
            hat.position.y = 2;
            climber.add(hat);

            // Backpack
            const backpack = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.8, 0.4),
                new THREE.MeshPhongMaterial({ color: 0xfbbf24 })
            );
            backpack.position.set(0, 0.8, -0.4);
            climber.add(backpack);

            // Ice axe
            const axeHandle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.03, 1),
                new THREE.MeshPhongMaterial({ color: 0x8b4513 })
            );
            axeHandle.position.set(0.5, 0.5, 0);
            axeHandle.rotation.z = -0.5;
            climber.add(axeHandle);

            climber.position.set(0, -5, 15);
            climber.castShadow = true;
            scene.add(climber);
        }

        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(200, 100);
            const groundMaterial = new THREE.MeshPhongMaterial({
                color: 0x228b22,
                shininess: 10
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -8;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add some grass patches
            for (let i = 0; i < 50; i++) {
                const grassGeometry = new THREE.ConeGeometry(0.2, 0.5, 4);
                const grassMaterial = new THREE.MeshPhongMaterial({
                    color: 0x32cd32,
                    flatShading: true
                });
                const grass = new THREE.Mesh(grassGeometry, grassMaterial);
                grass.position.set(
                    (Math.random() - 0.5) * 80,
                    -7.75,
                    (Math.random() - 0.5) * 40 + 20
                );
                grass.rotation.y = Math.random() * Math.PI;
                scene.add(grass);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Animate clouds
            clouds.forEach(cloud => {
                cloud.position.x += cloud.userData.speed;
                if (cloud.position.x > 50) {
                    cloud.position.x = -50;
                }
            });

            // Animate snowflakes
            snowflakes.forEach(snow => {
                const positions = snow.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] -= 0.02;
                    positions[i] += Math.sin(time + i) * 0.01;
                    
                    if (positions[i + 1] < -8) {
                        positions[i + 1] = 50;
                    }
                }
                snow.geometry.attributes.position.needsUpdate = true;
            });

            // Animate climber
            if (climber) {
                const targetMountain = mountains[currentTable - 2];
                if (targetMountain) {
                    const progressRatio = currentMultiplier / 10;
                    const mountainHeight = targetMountain.userData.height;
                    
                    // Smooth movement
                    const targetX = targetMountain.position.x + Math.sin(progressRatio * Math.PI * 2) * 2;
                    const targetY = -5 + progressRatio * mountainHeight * 0.8;
                    const targetZ = targetMountain.position.z + 8 - progressRatio * 3;
                    
                    climber.position.x += (targetX - climber.position.x) * 0.05;
                    climber.position.y += (targetY - climber.position.y) * 0.05;
                    climber.position.z += (targetZ - climber.position.z) * 0.05;
                    
                    // Climbing animation
                    climber.position.y += Math.sin(time * 3) * 0.1;
                    climber.rotation.y = Math.sin(time * 2) * 0.1;
                }
            }

            // Gentle camera movement
            camera.position.x = Math.sin(time * 0.1) * 2;
            camera.position.y = 15 + Math.sin(time * 0.15) * 1;

            renderer.render(scene, camera);
        }

        // Create UI elements
        function createTableGrid() {
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '';

            for (let i = 2; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'table-btn' + (i === currentTable ? ' current' : '');
                btn.textContent = i;
                btn.addEventListener('click', () => selectTable(i));
                grid.appendChild(btn);
            }

            // Add empty slot for visual balance
            const emptySlot = document.createElement('div');
            emptySlot.className = 'table-btn';
            emptySlot.style.opacity = '0';
            emptySlot.style.pointerEvents = 'none';
            grid.appendChild(emptySlot);
            grid.appendChild(emptySlot.cloneNode());
        }

        function createProgressSteps() {
            const progress = document.getElementById('mountain-progress');
            progress.innerHTML = '';

            for (let i = 1; i <= 9; i++) {
                const step = document.createElement('div');
                step.className = 'progress-step' + (i === currentMultiplier ? ' active' : '') + 
                               (i < currentMultiplier ? ' completed' : '');
                step.innerHTML = `
                    <div class="step-num">${i}</div>
                    <div class="step-text">${currentTable} × ${i} = ${currentTable * i}</div>
                `;
                progress.appendChild(step);
            }
        }

        function selectTable(tableNum) {
            currentTable = tableNum;
            currentMultiplier = 1;
            
            document.querySelectorAll('.table-btn').forEach((btn, i) => {
                btn.classList.toggle('current', i + 2 === tableNum);
            });
            
            document.getElementById('current-table').textContent = tableNum + '단';
            createProgressSteps();
            showProblem();
        }

        function showProblem() {
            document.getElementById('num1').textContent = currentTable;
            document.getElementById('num2').textContent = currentMultiplier;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            document.getElementById('position').textContent = currentMultiplier;
            
            createProgressSteps();
        }

        function submitAnswer() {
            const userAnswer = parseInt(document.getElementById('answer-input').value);
            const correctAnswer = currentTable * currentMultiplier;

            totalAttempts++;

            if (userAnswer === correctAnswer) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer(correctAnswer);
            }
        }

        function handleCorrectAnswer() {
            streak++;
            if (streak > maxStreak) {
                maxStreak = streak;
                document.getElementById('max-streak').textContent = maxStreak;
            }
            correctCount++;

            // Calculate score
            const basePoints = 50;
            const streakBonus = Math.min(streak * 10, 100);
            const tableBonus = currentTable * 5;
            const points = basePoints + streakBonus + tableBonus;
            score += points;

            showFeedback('🎉 정답!', '#10b981');
            createConfetti();

            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;

            // Move to next multiplier
            currentMultiplier++;

            if (currentMultiplier > 9) {
                // Table mastered!
                masteredTables.add(currentTable);
                document.getElementById('mastered-count').textContent = masteredTables.size;
                
                // Show flag on mountain
                const mountain = mountains[currentTable - 2];
                if (mountain) {
                    mountain.userData.flagPole.visible = true;
                    mountain.userData.flag.visible = true;
                }

                // Update button
                document.querySelectorAll('.table-btn')[currentTable - 2].classList.add('mastered');

                setTimeout(() => {
                    if (masteredTables.size === 8) {
                        celebrateCompletion();
                    } else {
                        // Move to next table
                        if (currentTable < 9) {
                            selectTable(currentTable + 1);
                        } else {
                            selectTable(2);
                        }
                    }
                }, 1500);
            } else {
                setTimeout(showProblem, 800);
            }
        }

        function handleWrongAnswer(correctAnswer) {
            streak = 0;
            score = Math.max(0, score - 10);

            showFeedback(`❌ ${correctAnswer}예요!`, '#ef4444');

            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            document.getElementById('answer-input').value = '';
        }

        function showFeedback(message, color) {
            const feedback = document.getElementById('feedback-message');
            feedback.textContent = message;
            feedback.style.color = color;
            feedback.style.textShadow = `0 0 40px ${color}`;
            feedback.classList.add('show');

            setTimeout(() => {
                feedback.classList.remove('show');
            }, 1200);
        }

        function usePowerUp(type) {
            if (powerUps[type] <= 0) return;

            powerUps[type]--;
            document.getElementById(`${type}-count`).textContent = powerUps[type];

            if (powerUps[type] === 0) {
                document.getElementById(`power-${type}`).classList.add('disabled');
            }

            switch (type) {
                case 'skip':
                    currentMultiplier++;
                    if (currentMultiplier > 9) {
                        currentMultiplier = 1;
                        if (currentTable < 9) currentTable++;
                    }
                    showProblem();
                    break;
                case 'hint':
                    const answer = currentTable * currentMultiplier;
                    const hint = `${Math.floor(answer / 10) || '?'}_`;
                    showFeedback(`💡 힌트: ${hint}`, '#fbbf24');
                    break;
                case 'freeze':
                    // Freeze effect - visual only for now
                    showFeedback('❄️ 시간 정지!', '#06b6d4');
                    break;
            }
        }

        function celebrateCompletion() {
            // Create massive confetti
            for (let i = 0; i < 100; i++) {
                setTimeout(() => createConfetti(), i * 30);
            }

            setTimeout(() => {
                alert(`🏔️ 축하합니다! 구구단 마스터가 되었습니다! 🏔️\n\n최종 점수: ${score}\n정답률: ${correctCount}/${totalAttempts} (${Math.round(correctCount/totalAttempts*100)}%)\n최대 연속 정답: ${maxStreak}🔥`);
            }, 2000);
        }

        function createConfetti() {
            const colors = ['#06b6d4', '#8b5cf6', '#fbbf24', '#10b981', '#ef4444', '#ec4899'];
            
            for (let i = 0; i < 20; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Event listeners
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.opacity = '0';
            document.getElementById('start-screen').style.transition = 'opacity 0.5s';
            
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                gameStarted = true;
                initThreeJS();
                createTableGrid();
                createProgressSteps();
                showProblem();
            }, 500);
        });

        document.getElementById('submit-btn').addEventListener('click', submitAnswer);
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitAnswer();
        });

        document.getElementById('power-skip').addEventListener('click', () => usePowerUp('skip'));
        document.getElementById('power-hint').addEventListener('click', () => usePowerUp('hint'));
        document.getElementById('power-freeze').addEventListener('click', () => usePowerUp('freeze'));
    </script>
</body>
</html>
