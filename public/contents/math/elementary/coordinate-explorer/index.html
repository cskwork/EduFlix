<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 에이전트: 좌표 해제 - 수학 게임</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans KR', 'Orbitron', sans-serif;
            overflow: hidden;
        }
        #game-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.4), inset 0 0 20px rgba(217, 70, 239, 0.2);
            border: 2px solid #1e293b;
            position: relative;
        }
        #game-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script>
// ═══════════════════════════════════════════════════════════════════════════
// 좌표 탐험대 - CYBERPUNK EDITION
// 초등학교 5-6학년 대상 (좌표평면과 사분면)
// ═══════════════════════════════════════════════════════════════════════════

const COLORS = {
    bgPrimary: 0x020617,
    bgSecondary: 0x0f172a,
    bgCard: 0x1e293b,
    primary: 0x0ea5e9, // Cyan
    primaryGlow: 0x38bdf8,
    secondary: 0xc026d3, // Magenta
    secondaryGlow: 0xe879f9,
    accent: 0xd946ef,
    success: 0x10b981, // Emerald neon
    warning: 0xf59e0b,
    error: 0xf43f5e,
    gold: 0xfcd34d,
    gridLine: 0x0ea5e9,
    axis: 0x38bdf8,
    textPrimary: 0xffffff,
    textSecondary: 0x94a3b8
};

// UI 헬퍼
const UI = {
    drawCyberBox(graphics, x, y, width, height, color, alpha = 0.8, borderColor = COLORS.primary) {
        graphics.fillStyle(color, alpha);
        graphics.beginPath();
        graphics.moveTo(x + 10, y);
        graphics.lineTo(x + width, y);
        graphics.lineTo(x + width, y + height - 10);
        graphics.lineTo(x + width - 10, y + height);
        graphics.lineTo(x, y + height);
        graphics.lineTo(x, y + 10);
        graphics.closePath();
        graphics.fillPath();

        graphics.lineStyle(2, borderColor, 1);
        graphics.strokePath();

        // Corner accents
        graphics.fillStyle(borderColor, 1);
        graphics.fillRect(x, y + 10, 4, 10);
        graphics.fillRect(x + width - 4, y + height - 20, 4, 10);
    }
};

const Icons = {
    drawStar(graphics, x, y, size, color = COLORS.primaryGlow) {
        graphics.fillStyle(color, 1);
        const points = [];
        for (let i = 0; i < 10; i++) {
            const radius = i % 2 === 0 ? size : size * 0.4;
            const angle = (i * Math.PI / 5) - Math.PI / 2;
            points.push({ x: x + Math.cos(angle) * radius, y: y + Math.sin(angle) * radius });
        }
        graphics.beginPath();
        graphics.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) graphics.lineTo(points[i].x, points[i].y);
        graphics.closePath();
        graphics.fillPath();
    },
    drawDataPacket(graphics, x, y, size) {
        // glowing cube
        graphics.fillStyle(COLORS.secondary, 0.8);
        graphics.fillRoundedRect(x - size * 0.4, y - size * 0.4, size * 0.8, size * 0.8, 4);
        graphics.lineStyle(2, COLORS.secondaryGlow, 1);
        graphics.strokeRoundedRect(x - size * 0.4, y - size * 0.4, size * 0.8, size * 0.8, 4);
        
        graphics.fillStyle(COLORS.textPrimary, 1);
        graphics.fillRect(x - size * 0.2, y - size * 0.1, size * 0.4, size * 0.05);
        graphics.fillRect(x - size * 0.2, y + size * 0.1, size * 0.4, size * 0.05);
        graphics.fillStyle(COLORS.primaryGlow, 1);
        graphics.fillCircle(x, y, size * 0.15);
    },
    drawFlag(graphics, x, y, size, color = COLORS.error) {
        // Red target crosshair
        graphics.lineStyle(2, color, 1);
        graphics.beginPath();
        graphics.arc(x, y, size * 0.6, 0, Math.PI * 2);
        graphics.strokePath();
        graphics.lineBetween(x - size, y, x - size * 0.2, y);
        graphics.lineBetween(x + size, y, x + size * 0.2, y);
        graphics.lineBetween(x, y - size, x, y - size * 0.2);
        graphics.lineBetween(x, y + size, x, y + size * 0.2);
        graphics.fillStyle(color, 1);
        graphics.fillCircle(x, y, 4);
    },
    drawRadar(graphics, x, y, size) {
        graphics.lineStyle(2, COLORS.primary, 0.8);
        graphics.strokeCircle(x, y, size);
        graphics.strokeCircle(x, y, size * 0.6);
        graphics.strokeCircle(x, y, size * 0.2);
        graphics.lineStyle(1, COLORS.primary, 0.4);
        graphics.lineBetween(x - size, y, x + size, y);
        graphics.lineBetween(x, y - size, x, y + size);

        // Blip
        graphics.fillStyle(COLORS.secondaryGlow, 1);
        graphics.fillCircle(x + size * 0.4, y - size * 0.4, 5);
        graphics.fillStyle(COLORS.success, 1);
        graphics.fillCircle(x - size * 0.6, y + size * 0.2, 4);
    },
    drawTrophy(graphics, x, y, size) {
        // Cyber Trophy (Hexagon core)
        graphics.lineStyle(4, COLORS.primaryGlow, 1);
        const pts = [];
        for(let i=0; i<6; i++) {
            const angle = i * Math.PI / 3;
            pts.push({x: x + Math.cos(angle) * size, y: y + Math.sin(angle) * size});
        }
        graphics.beginPath();
        graphics.moveTo(pts[0].x, pts[0].y);
        for(let i=1; i<6; i++) graphics.lineTo(pts[i].x, pts[i].y);
        graphics.closePath();
        graphics.strokePath();

        graphics.fillStyle(COLORS.secondaryGlow, 0.3);
        graphics.fillPath();
        
        UI.drawCyberBox(graphics, x - size * 0.5, y + size * 1.2, size, size * 0.4, COLORS.bgCard, 1, COLORS.primary);
        
        graphics.fillStyle(COLORS.success, 1);
        graphics.fillCircle(x, y, size * 0.4);
    }
};

// ═══════════════════════════════════════════════════════════════════════════
// Base Scene with Custom UI Factory
// ═══════════════════════════════════════════════════════════════════════════
class CyberScene extends Phaser.Scene {
    createButton(x, y, text, width, height, onClick) {
        const container = this.add.container(x, y);
        const bg = this.add.graphics();
        
        const drawBtn = (bgColor, strokeColor, scaleY=1) => {
            bg.clear();
            const w = width; const h = height;
            const hx = -w/2; const hy = -h/2 * scaleY;
            UI.drawCyberBox(bg, hx, hy, w, h * scaleY, bgColor, 1, strokeColor);
        };
        
        drawBtn(COLORS.bgSecondary, COLORS.primary);

        const label = this.add.text(0, 0, text, {
            fontFamily: 'Noto Sans KR',
            fontSize: '20px',
            color: '#ffffff',
            fontStyle: 'bold'
        }).setOrigin(0.5);

        container.add([bg, label]);
        container.setSize(width, height);
        container.setInteractive({ useHandCursor: true });

        container.on('pointerover', () => {
            drawBtn(COLORS.bgCard, COLORS.primaryGlow, 1.05);
            this.tweens.add({ targets: label, scale: 1.05, duration: 100 });
        });

        container.on('pointerout', () => {
            drawBtn(COLORS.bgSecondary, COLORS.primary, 1);
            this.tweens.add({ targets: label, scale: 1, duration: 100 });
        });

        container.on('pointerdown', () => {
             drawBtn(COLORS.primary, COLORS.textPrimary, 0.95);
             this.time.delayedCall(100, onClick);
        });

        return container;
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// BootScene - 초기화
// ═══════════════════════════════════════════════════════════════════════════
class BootScene extends CyberScene {
    constructor() { super('BootScene'); }
    create() {
        this.registry.set('score', 0);
        this.registry.set('level', 1);
        this.registry.set('treasuresFound', 0);
        this.scene.start('HookScene');
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// HookScene - 흥미 유발
// ═══════════════════════════════════════════════════════════════════════════
class HookScene extends CyberScene {
    constructor() { super('HookScene'); }

    create() {
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        // 글리치 텍스트 효과
        const title1 = this.add.text(300 + 2, 270, 'CYBER AGENT', { fontFamily: 'Orbitron', fontSize: '46px', color: '#0284c7', fontStyle: '900' }).setOrigin(0.5);
        const title2 = this.add.text(300 - 2, 270, 'CYBER AGENT', { fontFamily: 'Orbitron', fontSize: '46px', color: '#c026d3', fontStyle: '900' }).setOrigin(0.5);
        const title = this.add.text(300, 270, 'CYBER AGENT', { fontFamily: 'Orbitron', fontSize: '46px', color: '#ffffff', fontStyle: '900' }).setOrigin(0.5);

        this.tweens.add({
            targets: [title1, title2],
            alpha: { start: 0.8, to: 0.2 },
            x: { value: '+=Phaser.Math.Between(-3, 3)' },
            y: { value: '+=Phaser.Math.Between(-2, 2)' },
            yoyo: true,
            repeat: -1,
            duration: 100
        });

        this.add.text(300, 320, 'SYSTEM OVERRIDE : COORDINATES', {
            fontFamily: 'Noto Sans KR',
            fontSize: '18px',
            color: '#0ea5e9',
            letterSpacing: 2
        }).setOrigin(0.5);

        // 레이더 그래픽
        const radar = this.add.graphics();
        Icons.drawRadar(radar, 300, 140, 80);
        
        // 레이더 스윕 (회전하는 빔)
        const sweep = this.add.graphics();
        sweep.fillStyle(COLORS.primary, 0.2);
        sweep.moveTo(300, 140);
        sweep.arc(300, 140, 80, 0, Math.PI / 4);
        sweep.closePath();
        sweep.fillPath();
        this.tweens.add({
            targets: sweep,
            angle: 360,
            duration: 3000,
            repeat: -1,
            ease: 'Linear'
        });

        const storyTextContainer = this.add.graphics();
        UI.drawCyberBox(storyTextContainer, 80, 370, 440, 80, COLORS.bgSecondary, 0.7, COLORS.success);

        this.add.text(300, 410, '"블랙해커들이 탈취한 암호화 데이터 패킷이\n좌표평면 곳곳에 숨겨져 있다."', {
            fontFamily: 'Noto Sans KR',
            fontSize: '16px',
            lineSpacing: 8,
            align: 'center',
            color: '#94a3b8'
        }).setOrigin(0.5);


        // 시작 버튼
        const btn = this.createButton(300, 510, '시스템 부팅', 240, 56, () => {
            this.cameras.main.fadeOut(300, 0, 0, 0);
            this.time.delayedCall(300, () => this.scene.start('AnchorScene'));
        });
        
        this.cameras.main.fadeIn(500, 0, 0, 0);
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// AnchorScene - 좌표평면 개념 복습
// ═══════════════════════════════════════════════════════════════════════════
class AnchorScene extends CyberScene {
    constructor() { super('AnchorScene'); }

    create() {
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        this.add.text(300, 40, '📍 스캔 매뉴얼', {
            fontFamily: 'Noto Sans KR',
            fontSize: '26px',
            color: '#ffffff',
            fontStyle: 'bold'
        }).setOrigin(0.5);

        // 미니 좌표평면 
        this.drawMiniGrid(300, 220, 240);

        // 설명 박스
        const box = this.add.graphics();
        UI.drawCyberBox(box, 40, 370, 520, 120, COLORS.bgCard, 0.8, COLORS.primary);

        const explanations = [
            '• 기준점 O(Origin): 모든 스캔의 시작점 (0, 0)',
            '• 가로축(x축): 오른쪽(+), 왼쪽(-)',
            '• 세로축(y축): 위쪽(+), 아래쪽(-)',
            '• 표기법: 항상 (x, y) 순서로 해독한다.'
        ];

        explanations.forEach((text, idx) => {
            this.add.text(60, 390 + idx * 24, text, {
                fontFamily: 'Noto Sans KR',
                fontSize: '15px',
                color: '#e2e8f0'
            });
        });

        this.createButton(200, 540, '← 뒤로', 160, 50, () => {
            this.scene.start('HookScene');
        });
        this.createButton(400, 540, '다음 [스캔]', 160, 50, () => {
            this.scene.start('StoryScene');
        });
    }

    drawMiniGrid(cx, cy, size) {
        const graphics = this.add.graphics();
        const half = size / 2;
        const step = size / 10;

        // 격자
        graphics.lineStyle(1, COLORS.gridLine, 0.2);
        for (let i = -5; i <= 5; i++) {
            graphics.lineBetween(cx - half, cy + i * step, cx + half, cy + i * step);
            graphics.lineBetween(cx + i * step, cy - half, cx + i * step, cy + half);
        }

        // 축
        graphics.lineStyle(2, COLORS.primaryGlow, 0.8);
        graphics.lineBetween(cx - half - 10, cy, cx + half + 10, cy); // x축
        graphics.lineBetween(cx, cy - half - 10, cx, cy + half + 10); // y축

        // 축 레이블
        this.add.text(cx + half + 18, cy, 'X', { fontFamily: 'Orbitron', fontSize: '18px', color: '#38bdf8' }).setOrigin(0.5);
        this.add.text(cx, cy - half - 20, 'Y', { fontFamily: 'Orbitron', fontSize: '18px', color: '#38bdf8' }).setOrigin(0.5);

        // 숫자
        for (let i = -4; i <= 4; i++) {
            if (i === 0) continue;
            this.add.text(cx + i * step, cy + 14, i.toString(), { fontFamily: 'Orbitron', fontSize: '10px', color: '#64748b' }).setOrigin(0.5);
            this.add.text(cx - 16, cy - i * step, i.toString(), { fontFamily: 'Orbitron', fontSize: '10px', color: '#64748b' }).setOrigin(0.5);
        }

        // 예시 점 (3, -2)
        const exX = cx + 3 * step;
        const exY = cy + 2 * step; // 아래로
        graphics.fillStyle(COLORS.secondaryGlow, 1);
        graphics.fillCircle(exX, exY, 5);
        
        const labelBox = this.add.graphics();
        labelBox.fillStyle(COLORS.bgPrimary, 0.8);
        labelBox.lineStyle(1, COLORS.secondary, 1);
        labelBox.fillRect(exX + 10, exY - 20, 50, 20);
        labelBox.strokeRect(exX + 10, exY - 20, 50, 20);
        
        this.add.text(exX + 35, exY - 10, '(3, -2)', {
            fontFamily: 'Orbitron', fontSize: '12px', color: '#e879f9', fontStyle: 'bold'
        }).setOrigin(0.5);
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// StoryScene - 캐릭터 스토리
// ═══════════════════════════════════════════════════════════════════════════
class StoryScene extends CyberScene {
    constructor() { super('StoryScene'); }

    create() {
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        this.add.text(300, 40, '통신 연결 중...', {
            fontFamily: 'Noto Sans KR',
            fontSize: '16px',
            color: COLORS.success,
            fontStyle: 'bold'
        }).setOrigin(0.5);

        // Hacker Avatar
        const avatarBox = this.add.graphics();
        UI.drawCyberBox(avatarBox, 40, 80, 140, 140, COLORS.bgSecondary, 1, COLORS.secondary);
        
        const explorer = this.add.graphics();
        // Cyber Cat / Hacker
        explorer.fillStyle(0xffffff, 1);
        explorer.fillCircle(110, 150, 35);
        // Visor
        explorer.fillStyle(COLORS.secondary, 0.9);
        explorer.fillRoundedRect(80, 140, 60, 15, 3);
        explorer.lineStyle(2, COLORS.secondaryGlow, 1);
        explorer.strokeRoundedRect(80, 140, 60, 15, 3);
        // Cat Ears Cybernetic
        explorer.lineStyle(3, COLORS.primary, 1);
        explorer.strokeTriangle(85, 120, 95, 90, 110, 115);
        explorer.strokeTriangle(135, 120, 125, 90, 110, 115);

        this.add.text(110, 240, '요원 CIPHER', { fontFamily: 'Orbitron', fontSize: '18px', color: '#e879f9', fontStyle: 'bold' }).setOrigin(0.5);

        // 말풍선
        const bubble = this.add.graphics();
        UI.drawCyberBox(bubble, 200, 80, 360, 200, COLORS.bgCard, 0.9, COLORS.primary);
        bubble.lineStyle(2, COLORS.primary, 1);
        bubble.lineBetween(180, 150, 200, 160);
        bubble.lineBetween(180, 150, 200, 140);

        // 대사 (타이핑 효과)
        const dialogue = [
            '에이전트, 스캐너에 접속한 것을 환영한다.',
            '',
            '우리의 타겟 데이터가 암호화되어',
            '그리드 좌표 내부에 숨겨져 있다.',
            '',
            '시스템이 알려주는 목표 (X, Y) 좌표를',
            '정확히 클릭해서 데이터를 해킹하라. 운을 빈다.'
        ];

        let y = 110;
        dialogue.forEach((line, idx) => {
            const text = this.add.text(220, y, '', {
                fontFamily: 'Noto Sans KR',
                fontSize: '15px',
                color: '#e2e8f0'
            });

            this.typeText(text, line, idx * 500);
            y += 24;
        });

        // 시작 버튼 (딜레이 후 표시)
        this.time.delayedCall(4000, () => {
             const btn = this.createButton(300, 480, '스캐너 가동', 240, 60, () => {
                this.scene.start('CoreScene');
            });
            btn.setAlpha(0);
            this.tweens.add({ targets: btn, alpha: 1, duration: 500 });
        });
    }

    typeText(textObj, fullText, delay) {
        let i = 0;
        this.time.delayedCall(delay, () => {
            this.time.addEvent({
                delay: 20,
                repeat: fullText.length - 1,
                callback: () => {
                    textObj.setText(fullText.substring(0, ++i));
                }
            });
        });
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// CoreScene - 핵심 게임플레이 (좌표 찾기)
// ═══════════════════════════════════════════════════════════════════════════
class CoreScene extends CyberScene {
    constructor() { super('CoreScene'); }

    create() {
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        this.gridSize = 360;
        this.gridX = 300;
        this.gridY = 320;
        this.step = this.gridSize / 10;
        this.currentRound = 0;
        this.maxRounds = 8;
        this.score = 0;

        // 헤더 패널
        const header = this.add.graphics();
        UI.drawCyberBox(header, 20, 20, 560, 60, COLORS.bgCard, 0.8, COLORS.primary);
        
        this.roundText = this.add.text(50, 50, 'ROUND 1/8', { fontFamily: 'Orbitron', fontSize: '18px', color: '#38bdf8' }).setOrigin(0, 0.5);
        this.scoreText = this.add.text(550, 50, 'SCORE: 000', { fontFamily: 'Orbitron', fontSize: '18px', color: '#fcd34d' }).setOrigin(1, 0.5);

        // 중앙 좌표 지시
        this.targetLabel = this.add.text(300, 35, 'TARGET', { fontFamily: 'Orbitron', fontSize: '12px', color: '#94a3b8' }).setOrigin(0.5);
        this.questionText = this.add.text(300, 55, '(0, 0)', {
            fontFamily: 'Orbitron', fontSize: '24px', color: '#e879f9', fontStyle: 'bold'
        }).setOrigin(0.5);

        // 피드백 텍스트
        this.feedbackText = this.add.text(300, 540, 'SYSTEM READY', {
            fontFamily: 'Noto Sans KR', fontSize: '16px', color: '#10b981', fontStyle: 'bold'
        }).setOrigin(0.5);

        // 좌표평면 그리기
        this.drawGrid();

        this.problems = this.generateProblems();
        this.nextProblem();
    }

    generateProblems() {
        const problems = [];
        const used = new Set();
        while (problems.length < this.maxRounds) {
            const x = Phaser.Math.Between(-4, 4);
            const y = Phaser.Math.Between(-4, 4);
            const key = `${x},${y}`;
            if (!used.has(key) && !(x === 0 && y === 0)) {
                used.add(key);
                problems.push({ x, y });
            }
        }
        return problems;
    }

    drawGrid() {
        const graphics = this.add.graphics();
        const cx = this.gridX;
        const cy = this.gridY;
        const half = this.gridSize / 2;
        const step = this.step;

        // 망 레이더 느낌
        graphics.fillStyle(COLORS.bgSecondary, 0.6);
        graphics.fillRect(cx - half, cy - half, this.gridSize, this.gridSize);
        graphics.lineStyle(2, COLORS.primary, 1);
        graphics.strokeRect(cx - half, cy - half, this.gridSize, this.gridSize);

        // 격자선
        graphics.lineStyle(1, COLORS.gridLine, 0.2);
        for (let i = -5; i <= 5; i++) {
            graphics.lineBetween(cx - half, cy + i * step, cx + half, cy + i * step);
            graphics.lineBetween(cx + i * step, cy - half, cx + i * step, cy + half);
        }

        // 축
        graphics.lineStyle(2, COLORS.primaryGlow, 0.8);
        graphics.lineBetween(cx - half, cy, cx + half, cy);
        graphics.lineBetween(cx, cy - half, cx, cy + half);

        // 텍스트
        this.add.text(cx + half + 20, cy, 'X', { fontFamily: 'Orbitron', fontSize: '20px', color: '#38bdf8' }).setOrigin(0.5);
        this.add.text(cx, cy - half - 20, 'Y', { fontFamily: 'Orbitron', fontSize: '20px', color: '#38bdf8' }).setOrigin(0.5);

        for (let i = -4; i <= 4; i++) {
            if (i === 0) continue;
            this.add.text(cx + i * step, cy + half + 14, i.toString(), { fontFamily: 'Orbitron', fontSize: '12px', color: '#64748b' }).setOrigin(0.5);
            this.add.text(cx - half - 14, cy - i * step, i.toString(), { fontFamily: 'Orbitron', fontSize: '12px', color: '#64748b' }).setOrigin(0.5);
        }

        this.add.text(cx - 12, cy + 12, 'O', { fontFamily: 'Orbitron', fontSize: '12px', color: '#38bdf8' }).setOrigin(0.5);

        // 클릭 존 배치 및 호버링 이펙트
        this.hoverGlow = this.add.graphics();
        
        this.clickZones = [];
        for (let gx = -4; gx <= 4; gx++) {
            for (let gy = -4; gy <= 4; gy++) {
                if (gx === 0 && gy === 0) continue;

                const px = cx + gx * step;
                const py = cy - gy * step;

                const zone = this.add.rectangle(px, py, step*0.8, step*0.8, 0x000000, 0);
                zone.setInteractive({ useHandCursor: true });

                zone.on('pointerover', () => {
                    if (!this.answered) {
                        this.hoverGlow.clear();
                        this.hoverGlow.lineStyle(2, COLORS.secondaryGlow, 0.8);
                        this.hoverGlow.strokeRect(px - 10, py - 10, 20, 20);
                    }
                });

                zone.on('pointerout', () => {
                    if (!this.answered) this.hoverGlow.clear();
                });

                zone.on('pointerdown', () => {
                    if (!this.answered) this.checkAnswer(gx, gy, px, py);
                });
            }
        }
    }

    nextProblem() {
        if (this.currentRound >= this.maxRounds) {
            this.scene.start('VisualizeScene');
            return;
        }

        this.answered = false;
        this.hoverGlow.clear();
        this.currentProblem = this.problems[this.currentRound];
        this.currentRound++;

        this.roundText.setText(`ROUND ${this.currentRound}/${this.maxRounds}`);
        this.questionText.setText(`( ${this.currentProblem.x}, ${this.currentProblem.y} )`);
        this.feedbackText.setText('');

        // 카메라 쉐이크 후 타겟 팝업
        this.tweens.add({
            targets: this.questionText,
            scale: { from: 1.5, to: 1 },
            alpha: { from: 0, to: 1 },
            duration: 300,
            ease: 'Back.easeOut'
        });

        if (this.treasureMarker) this.treasureMarker.destroy();
    }

    checkAnswer(clickX, clickY, px, py) {
        this.answered = true;
        this.hoverGlow.clear();

        const isCorrect = clickX === this.currentProblem.x && clickY === this.currentProblem.y;

        if (isCorrect) {
            this.score += 10;
            this.registry.set('score', this.score);
            this.registry.inc('treasuresFound', 1);
            this.scoreText.setText(`SCORE: ${this.score.toString().padStart(3,'0')}`);

            // 보물 표시
            this.treasureMarker = this.add.graphics();
            Icons.drawDataPacket(this.treasureMarker, px, py, 26);

            this.showSuccessParticles(px, py);

            this.feedbackText.setColor('#10b981');
            this.feedbackText.setText('> DECRYPT SUCCESS_ 데이터 코어 획득!');
        } else {
            // 틀린 위치
            const wrongMarker = this.add.graphics();
            Icons.drawFlag(wrongMarker, px, py, 20, COLORS.error);

            // 정답 위치
            const correctPx = this.gridX + this.currentProblem.x * this.step;
            const correctPy = this.gridY - this.currentProblem.y * this.step;
            this.treasureMarker = this.add.graphics();
            Icons.drawDataPacket(this.treasureMarker, correctPx, correctPy, 26);
            this.treasureMarker.setAlpha(0.5);

            this.feedbackText.setColor('#f43f5e');
            this.feedbackText.setText(`> ACCESS DENIED_ 타겟은 (${this.currentProblem.x}, ${this.currentProblem.y})`);

            this.cameras.main.shake(200, 0.01);
            this.time.delayedCall(1500, () => wrongMarker.destroy());
        }

        this.time.delayedCall(1800, () => this.nextProblem());
    }

    showSuccessParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            const particle = this.add.rectangle(x, y, Phaser.Math.Between(4, 8), Phaser.Math.Between(4, 8), [COLORS.primary, COLORS.secondary, COLORS.success][i%3], 1);
            const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
            const speed = Phaser.Math.FloatBetween(30, 80);
            
            this.tweens.add({
                targets: particle,
                x: x + Math.cos(angle) * speed,
                y: y + Math.sin(angle) * speed,
                alpha: 0,
                rotation: Phaser.Math.FloatBetween(0, 5),
                duration: 800,
                onComplete: () => particle.destroy()
            });
        }
    }
}

// VisualizeScene - 사분면 설명
// ═══════════════════════════════════════════════════════════════════════════
class VisualizeScene extends CyberScene {
    constructor() { super('VisualizeScene'); }

    create() {
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        this.add.text(300, 30, 'SECTOR ANALYSIS', { fontFamily: 'Orbitron', fontSize: '26px', color: COLORS.textPrimary, fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(300, 60, '스캐너는 4개의 구역(사분면)으로 나뉜다.', { fontFamily: 'Noto Sans KR', fontSize: '15px', color: COLORS.textSecondary }).setOrigin(0.5);

        // 큰 4분면 맵
        const cx = 300; const cy = 250; const size = 260;
        const half = size/2;
        
        const map = this.add.graphics();
        // Sector backgrounds
        map.fillStyle(COLORS.success, 0.1); map.fillRect(cx - half, cy - half, half, half); // Q2
        map.fillStyle(COLORS.primary, 0.1); map.fillRect(cx, cy - half, half, half); // Q1
        map.fillStyle(COLORS.accent, 0.1); map.fillRect(cx - half, cy, half, half); // Q3
        map.fillStyle(COLORS.warning, 0.1); map.fillRect(cx, cy, half, half); // Q4
        
        // Axes
        map.lineStyle(3, COLORS.textPrimary, 1);
        map.lineBetween(cx - half - 10, cy, cx + half + 10, cy);
        map.lineBetween(cx, cy - half - 10, cx, cy + half + 10);
        map.fillStyle(COLORS.textPrimary, 1);
        map.fillCircle(cx, cy, 5);

        // Labels
        const lbls = [
            { x: cx + half/2, y: cy - half/2, t1: '제1사분면', t2: '(+, +)', c: '#0ea5e9' },
            { x: cx - half/2, y: cy - half/2, t1: '제2사분면', t2: '(-, +)', c: '#10b981' },
            { x: cx - half/2, y: cy + half/2, t1: '제3사분면', t2: '(-, -)', c: '#d946ef' },
            { x: cx + half/2, y: cy + half/2, t1: '제4사분면', t2: '(+, -)', c: '#f59e0b' }
        ];

        lbls.forEach(l => {
            this.add.text(l.x, l.y - 15, l.t1, { fontFamily: 'Noto Sans KR', fontSize: '18px', color: l.c, fontStyle: 'bold' }).setOrigin(0.5);
            this.add.text(l.x, l.y + 10, l.t2, { fontFamily: 'Orbitron', fontSize: '16px', color: '#fff' }).setOrigin(0.5);
        });

        // 경고 박스
        const tipBox = this.add.graphics();
        UI.drawCyberBox(tipBox, 60, 420, 480, 60, COLORS.bgCard, 0.8, COLORS.error);
        this.add.text(300, 450, '[WARNING] 축(선) 위에 있는 점은 어느 사분면에도 포함되지 않는다.', { fontFamily: 'Noto Sans KR', fontSize: '14px', color: '#f43f5e' }).setOrigin(0.5);


        this.createButton(300, 540, '메인 서버 해킹(퀴즈)', 260, 50, () => {
            this.scene.start('QuizScene');
        });
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// QuizScene - 퀴즈
// ═══════════════════════════════════════════════════════════════════════════
class QuizScene extends CyberScene {
    constructor() { super('QuizScene'); }

    create() {
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        this.quizzes = [
            { q: '점 A가 원점에서 오른쪽 3, 위로 4에 있다면\nA의 좌표는?', a: '(3, 4)', options: ['(4, 3)', '(3, 4)', '(-3, 4)', '(3, -4)'] },
            { q: '좌표 (-2, 5)는 어느 사분면에 있을까요?', a: '제2사분면', options: ['제1사분면', '제2사분면', '제3사분면', '제4사분면'] },
            { q: '점 (0, 3)은 어디에 위치할까요?', a: 'y축 위', options: ['x축 위', 'y축 위', '원점', '제1사분면'] },
            { q: '원점의 좌표는 무엇일까요?', a: '(0, 0)', options: ['(1, 1)', '(0, 1)', '(1, 0)', '(0, 0)'] },
            { q: '좌표 (4, -3)에서 y값은 무엇을 의미할까요?', a: '아래 쪽으로 3칸', options: ['오른쪽으로 3칸', '왼쪽으로 3칸', '위 쪽으로 3칸', '아래 쪽으로 3칸'] }
        ];

        this.currentQuiz = 0;
        this.quizCorrect = 0;

        this.showQuiz();
    }

    showQuiz() {
        this.children.removeAll();
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        const quiz = this.quizzes[this.currentQuiz];

        this.add.text(300, 40, `FIREWALL BYPASS ${this.currentQuiz + 1}/${this.quizzes.length}`, {
            fontFamily: 'Orbitron', fontSize: '20px', color: COLORS.accent
        }).setOrigin(0.5);

        // 질문 패널
        const qBg = this.add.graphics();
        UI.drawCyberBox(qBg, 40, 90, 520, 120, COLORS.bgSecondary, 0.9, COLORS.primaryGlow);

        this.add.text(300, 150, quiz.q, {
            fontFamily: 'Noto Sans KR', fontSize: '20px', color: '#ffffff', fontStyle: 'bold', align: 'center', lineSpacing: 8
        }).setOrigin(0.5);

        // 선택지
        const shuffled = Phaser.Utils.Array.Shuffle([...quiz.options]);
        shuffled.forEach((opt, idx) => {
            const bx = 160 + (idx % 2) * 280;
            const by = 280 + Math.floor(idx / 2) * 80;
            this.createButton(bx, by, opt, 240, 60, () => {
                this.checkQuizAnswer(opt, quiz.a);
            });
        });
    }

    checkQuizAnswer(selected, correct) {
        if (selected === correct) {
            this.quizCorrect++;
            this.showFeedback(true, 'ACCESS GRANTED');
        } else {
            this.showFeedback(false, `ACCESS DENIED (정답: ${correct})`);
        }
    }

    showFeedback(isCorrect, message) {
        const bg = this.add.graphics();
        bg.fillStyle(COLORS.bgPrimary, 0.9);
        bg.fillRect(0, 440, 600, 100);
        
        const feedback = this.add.text(300, 490, message, {
            fontFamily: 'Orbitron',
            fontSize: '24px',
            color: isCorrect ? '#10b981' : '#f43f5e',
            fontStyle: 'bold'
        }).setOrigin(0.5);

        if(!isCorrect) this.cameras.main.shake(100, 0.01);

        this.time.delayedCall(1500, () => {
            this.currentQuiz++;
            if (this.currentQuiz >= this.quizzes.length) {
                this.registry.set('quizScore', this.quizCorrect);
                this.scene.start('WrapScene');
            } else {
                this.showQuiz();
            }
        });
    }
}

// WrapScene - 완료/보상
// ═══════════════════════════════════════════════════════════════════════════
class WrapScene extends CyberScene {
    constructor() { super('WrapScene'); }

    create() {
        this.add.rectangle(300, 300, 600, 600, COLORS.bgPrimary);

        for (let i = 0; i < 40; i++) {
            const particle = this.add.graphics();
            particle.fillStyle([COLORS.primary, COLORS.secondary, COLORS.success, COLORS.textPrimary][i % 4], 0.8);
            if(i%2===0) particle.fillRect(0, 0, Phaser.Math.Between(4, 10), Math.Between(2, 4));
            else particle.fillCircle(0, 0, Phaser.Math.Between(2, 4));
            
            particle.setPosition(Phaser.Math.Between(0, 600), -50);

            this.tweens.add({
                targets: particle,
                y: 650,
                x: particle.x + Phaser.Math.Between(-30, 30),
                duration: Phaser.Math.Between(2000, 5000),
                delay: Phaser.Math.Between(0, 1000)
            });
        }

        const trophy = this.add.graphics();
        Icons.drawTrophy(trophy, 300, 150, 60);

        this.add.text(300, 260, 'SYSTEM OVERRIDE COMPLETE', {
            fontFamily: 'Orbitron', fontSize: '28px', color: COLORS.success, fontStyle: 'bold'
        }).setOrigin(0.5);

        const score = this.registry.get('score');
        const quizScore = this.registry.get('quizScore') || 0;
        const totalScore = score + quizScore * 20;

        this.add.text(300, 310, `TOTAL SCORE : ${totalScore}`, {
            fontFamily: 'Orbitron', fontSize: '24px', color: COLORS.gold
        }).setOrigin(0.5);

        // 요약 패널
        const summary = this.add.graphics();
        UI.drawCyberBox(summary, 60, 360, 480, 100, COLORS.bgCard, 0.8, COLORS.primary);

        this.add.text(300, 410, '[ 데이터 해제 완료 ]\n> (x, y) 순서로 좌표 해독\n> 원점 (0,0)과 4개의 사분면 통제권 확보', {
            fontFamily: 'Noto Sans KR', fontSize: '15px', color: '#94a3b8', align: 'center', lineSpacing: 6
        }).setOrigin(0.5);

        this.createButton(300, 520, '시스템 재가동', 200, 56, () => {
            this.scene.start('BootScene');
        });
    }
}
