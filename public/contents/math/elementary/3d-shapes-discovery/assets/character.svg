<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 도형이 - 토끼 도슨트 캐릭터 -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2"/>
      <stop offset="100%" style="stop-color:#fcb69f"/>
    </linearGradient>
  </defs>

  <!-- 몸통 -->
  <ellipse cx="100" cy="150" rx="45" ry="40" fill="url(#bodyGrad)"/>

  <!-- 머리 -->
  <circle cx="100" cy="90" r="45" fill="#fff5e6"/>

  <!-- 귀 -->
  <ellipse cx="70" cy="35" rx="12" ry="35" fill="#fff5e6"/>
  <ellipse cx="70" cy="35" rx="6" ry="25" fill="#ffb6c1"/>
  <ellipse cx="130" cy="35" rx="12" ry="35" fill="#fff5e6"/>
  <ellipse cx="130" cy="35" rx="6" ry="25" fill="#ffb6c1"/>

  <!-- 눈 -->
  <circle cx="80" cy="85" r="10" fill="#333"/>
  <circle cx="120" cy="85" r="10" fill="#333"/>
  <circle cx="83" cy="82" r="3" fill="#fff"/>
  <circle cx="123" cy="82" r="3" fill="#fff"/>

  <!-- 볼터치 -->
  <ellipse cx="60" cy="100" rx="10" ry="6" fill="#ffb6c1" opacity="0.6"/>
  <ellipse cx="140" cy="100" rx="10" ry="6" fill="#ffb6c1" opacity="0.6"/>

  <!-- 코 -->
  <ellipse cx="100" cy="100" rx="6" ry="5" fill="#ff9999"/>

  <!-- 입 -->
  <path d="M90 110 Q100 120 110 110" stroke="#666" stroke-width="2" fill="none"/>

  <!-- 수염 -->
  <line x1="50" y1="95" x2="75" y2="100" stroke="#ccc" stroke-width="1"/>
  <line x1="50" y1="105" x2="75" y2="105" stroke="#ccc" stroke-width="1"/>
  <line x1="125" y1="100" x2="150" y2="95" stroke="#ccc" stroke-width="1"/>
  <line x1="125" y1="105" x2="150" y2="105" stroke="#ccc" stroke-width="1"/>

  <!-- 도슨트 뱃지 -->
  <rect x="75" y="130" rx="5" ry="5" width="50" height="25" fill="#667eea"/>
  <text x="100" y="147" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">도형이</text>

  <!-- 손에 든 정육면체 -->
  <g transform="translate(145, 120)">
    <path d="M0 10 L15 0 L30 10 L30 30 L15 40 L0 30 Z" fill="#E91E63"/>
    <path d="M15 0 L30 10 L30 30 L15 20 Z" fill="#c2185b"/>
    <path d="M0 10 L15 20 L15 40 L0 30 Z" fill="#f48fb1"/>
  </g>
</svg>
