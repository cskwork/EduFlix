<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB"/>
      <stop offset="100%" style="stop-color:#F5576C"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- 피자 3등분 -->
  <g transform="translate(120, 130)">
    <!-- 전체 피자 -->
    <circle r="50" fill="#FFC107" stroke="#FF9800" stroke-width="2"/>

    <!-- 3등분 선 -->
    <g stroke="#E65100" stroke-width="2">
      <line x1="0" y1="-50" x2="0" y2="25"/>
      <line x1="0" y1="0" x2="-43" y2="25"/>
      <line x1="0" y1="0" x2="43" y2="25"/>
    </g>

    <!-- 1조각 분리 -->
    <path d="M0,0 L0,-50 A50,50 0 0,1 43,25 Z" fill="#FFE082" stroke="#FF9800" stroke-width="2" transform="translate(5, -5)"/>
  </g>

  <!-- 나눗셈 기호 -->
  <text x="200" y="140" text-anchor="middle" fill="#fff" font-size="40" font-weight="bold">÷</text>

  <!-- 2등분 표시 -->
  <g transform="translate(280, 130)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="#fff" fill-opacity="0.3"/>
    <text x="0" y="10" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">2</text>
  </g>

  <!-- 수식 -->
  <g transform="translate(200, 230)">
    <text x="0" y="0" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">
      1/3 ÷ 2 = 1/3 x 1/2 = 1/6
    </text>
  </g>

  <!-- 제목 -->
  <text x="200" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">분수의 나눗셈</text>

  <!-- 부제목 -->
  <text x="200" y="65" text-anchor="middle" fill="#fff" font-size="14" fill-opacity="0.9">똑같이 나누기</text>
</svg>
