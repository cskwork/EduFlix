<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ED213A"/>
      <stop offset="100%" style="stop-color:#93291E"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- 레시피 카드 -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="#fff" fill-opacity="0.95"/>
    <text x="50" y="25" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">4인분</text>

    <!-- 재료 바 -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="80" height="15" rx="3" fill="#FF5722"/>
      <text x="5" y="11" fill="#fff" font-size="9">떡 400g</text>
    </g>
    <g transform="translate(10, 60)">
      <rect x="0" y="0" width="60" height="15" rx="3" fill="#D32F2F"/>
      <text x="5" y="11" fill="#fff" font-size="9">고추장</text>
    </g>
    <g transform="translate(10, 80)">
      <rect x="0" y="0" width="40" height="15" rx="3" fill="#FFC107"/>
      <text x="5" y="11" fill="#333" font-size="9">설탕</text>
    </g>
    <g transform="translate(10, 100)">
      <rect x="0" y="0" width="50" height="15" rx="3" fill="#8D6E63"/>
      <text x="5" y="11" fill="#fff" font-size="9">어묵</text>
    </g>
  </g>

  <!-- 화살표 -->
  <g transform="translate(190, 135)">
    <polygon points="0,0 30,0 30,-8 50,10 30,28 30,20 0,20" fill="#FFD54F"/>
    <text x="25" y="40" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">x2</text>
  </g>

  <!-- 8인분 카드 -->
  <g transform="translate(250, 70)">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="#fff" fill-opacity="0.95"/>
    <text x="50" y="25" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">8인분</text>

    <!-- 재료 바 (2배) -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="80" height="15" rx="3" fill="#FF5722"/>
      <rect x="0" y="0" width="80" height="15" rx="3" fill="#FF5722" fill-opacity="0.5" transform="translate(0, 2)"/>
      <text x="5" y="11" fill="#fff" font-size="9">떡 800g</text>
    </g>
    <g transform="translate(10, 60)">
      <rect x="0" y="0" width="60" height="15" rx="3" fill="#D32F2F"/>
      <rect x="0" y="0" width="60" height="15" rx="3" fill="#D32F2F" fill-opacity="0.5" transform="translate(0, 2)"/>
      <text x="5" y="11" fill="#fff" font-size="9">고추장 x2</text>
    </g>
    <g transform="translate(10, 80)">
      <rect x="0" y="0" width="40" height="15" rx="3" fill="#FFC107"/>
      <rect x="0" y="0" width="40" height="15" rx="3" fill="#FFC107" fill-opacity="0.5" transform="translate(0, 2)"/>
      <text x="5" y="11" fill="#333" font-size="9">설탕 x2</text>
    </g>
    <g transform="translate(10, 100)">
      <rect x="0" y="0" width="50" height="15" rx="3" fill="#8D6E63"/>
      <rect x="0" y="0" width="50" height="15" rx="3" fill="#8D6E63" fill-opacity="0.5" transform="translate(0, 2)"/>
      <text x="5" y="11" fill="#fff" font-size="9">어묵 x2</text>
    </g>
  </g>

  <!-- 수식 -->
  <text x="200" y="250" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">
    비율이 같으면 맛도 같다!
  </text>

  <!-- 제목 -->
  <text x="200" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">비와 비율</text>
</svg>
