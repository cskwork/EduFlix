<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>측정 연구소 3D | 동아출판 수학</title>
    <meta name="description" content="3D 공간에서 길이, 무게, 부피를 측정하고 배워보세요!">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --secondary: #06b6d4;
            --accent: #fbbf24;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #7c3aed 100%);
            color: #fff;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Top bar */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        .stat-box {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 14px 24px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-2px);
        }

        .stat-box .icon {
            font-size: 22px;
        }

        .stat-box .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        /* Category panel */
        #category-panel {
            position: absolute;
            top: 100px;
            left: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 20px;
            pointer-events: auto;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 260px;
        }

        #category-panel h3 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .category-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: rgba(139, 92, 246, 0.2);
            border: 2px solid transparent;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-btn:hover {
            background: rgba(139, 92, 246, 0.4);
            transform: translateX(5px);
        }

        .category-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.5);
        }

        .category-btn .cat-icon {
            font-size: 28px;
        }

        .category-btn .cat-info {
            flex: 1;
        }

        .category-btn .cat-name {
            display: block;
            font-size: 16px;
        }

        .category-btn .cat-desc {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .category-btn .cat-progress {
            font-size: 14px;
            color: var(--accent);
        }

        /* Difficulty selector */
        .difficulty-selector {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .diff-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .diff-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .diff-btn.active {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border-color: var(--success);
        }

        /* Object info panel */
        #object-panel {
            position: absolute;
            top: 100px;
            right: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 20px;
            pointer-events: auto;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 300px;
        }

        #object-panel h3 {
            color: var(--accent);
            margin-bottom: 16px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .object-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }

        .object-preview .object-icon {
            font-size: 64px;
            margin-bottom: 8px;
        }

        .object-preview .object-name {
            font-size: 18px;
            font-weight: 600;
        }

        .measurement-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .measure-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .measure-item .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .measure-item .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--secondary);
        }

        /* Main game area */
        #game-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            text-align: center;
            pointer-events: auto;
        }

        #question-display {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 36px;
            border-radius: 24px;
            margin-bottom: 24px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        #question-text {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .answer-input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        #answer-input {
            width: 150px;
            height: 60px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            border: 3px solid var(--glass-border);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark);
            transition: all 0.3s;
        }

        #answer-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
        }

        #unit-selector {
            height: 60px;
            padding: 0 20px;
            font-size: 20px;
            font-weight: 600;
            border: 3px solid var(--glass-border);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark);
            cursor: pointer;
            transition: all 0.3s;
        }

        #unit-selector:focus {
            outline: none;
            border-color: var(--secondary);
        }

        /* Action buttons */
        #action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 16px;
            padding: 18px 36px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.6);
        }

        .action-btn.submit {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .action-btn.hint {
            background: linear-gradient(135deg, var(--accent) 0%, #f59e0b 100%);
            color: var(--dark);
        }

        /* Hint display */
        #hint-display {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(245, 158, 11, 0.2) 100%);
            border: 2px solid var(--accent);
            padding: 20px 30px;
            border-radius: 16px;
            color: var(--accent);
            font-size: 18px;
            font-weight: 600;
            max-width: 500px;
            text-align: center;
            display: none;
            box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3);
        }

        #hint-display.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Progress bar */
        #progress-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 500px;
        }

        #progress-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--success));
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Feedback message */
        #feedback-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.3s;
            text-align: center;
        }

        #feedback-message.show {
            opacity: 1;
            animation: feedbackPop 0.5s ease;
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Start screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #7c3aed 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            overflow: hidden;
        }

        .floating-tools {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .tool {
            position: absolute;
            font-size: 60px;
            opacity: 0.15;
            animation: floatTool 15s ease-in-out infinite;
        }

        @keyframes floatTool {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        #start-screen h1 {
            font-size: clamp(40px, 8vw, 72px);
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            text-align: center;
        }

        #start-screen .subtitle {
            font-size: clamp(16px, 3vw, 22px);
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 48px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            padding: 0 20px;
        }

        #start-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #f59e0b 100%);
            border: none;
            border-radius: 50px;
            padding: 22px 64px;
            color: var(--dark);
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(251, 191, 36, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #start-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 60px rgba(251, 191, 36, 0.7);
        }

        .features {
            display: flex;
            gap: 40px;
            margin-top: 60px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .feature {
            text-align: center;
            max-width: 180px;
        }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .feature-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Unit reference card */
        #unit-reference {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-radius: 16px;
            pointer-events: auto;
            border: 1px solid var(--glass-border);
            font-size: 13px;
        }

        #unit-reference h4 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .unit-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Celebration */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 1000;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            #category-panel, #object-panel, #unit-reference {
                display: none;
            }

            #question-text {
                font-size: 20px;
            }

            #answer-input {
                width: 120px;
                height: 50px;
                font-size: 24px;
            }

            #unit-selector {
                height: 50px;
                font-size: 16px;
            }

            .action-btn {
                padding: 14px 24px;
                font-size: 16px;
            }

            .stat-box {
                padding: 10px 14px;
                font-size: 13px;
            }

            #top-bar {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>

        <div id="ui-overlay">
            <div id="top-bar">
                <div class="stat-box">
                    <span class="icon">🔬</span>
                    <span>레벨</span>
                    <span class="value" id="level">1</span>
                </div>
                <div class="stat-box">
                    <span class="icon">⭐</span>
                    <span>점수</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="icon">✅</span>
                    <span>정답</span>
                    <span class="value"><span id="correct-count">0</span>/<span id="total-count">0</span></span>
                </div>
            </div>

            <div id="category-panel">
                <h3>🔬 측정 영역</h3>
                <div class="category-buttons">
                    <button class="category-btn active" data-category="length">
                        <span class="cat-icon">📏</span>
                        <span class="cat-info">
                            <span class="cat-name">길이</span>
                            <span class="cat-desc">cm, m로 길이 측정</span>
                        </span>
                        <span class="cat-progress" id="length-progress">0/5</span>
                    </button>
                    <button class="category-btn" data-category="weight">
                        <span class="cat-icon">⚖️</span>
                        <span class="cat-info">
                            <span class="cat-name">무게</span>
                            <span class="cat-desc">g, kg으로 무게 측정</span>
                        </span>
                        <span class="cat-progress" id="weight-progress">0/5</span>
                    </button>
                    <button class="category-btn" data-category="volume">
                        <span class="cat-icon">🧪</span>
                        <span class="cat-info">
                            <span class="cat-name">부피</span>
                            <span class="cat-desc">mL, L로 부피 측정</span>
                        </span>
                        <span class="cat-progress" id="volume-progress">0/5</span>
                    </button>
                </div>
                <div class="difficulty-selector">
                    <button class="diff-btn active" data-diff="easy">쉬움</button>
                    <button class="diff-btn" data-diff="medium">보통</button>
                    <button class="diff-btn" data-diff="hard">어려움</button>
                </div>
            </div>

            <div id="object-panel">
                <h3><span id="object-icon">📦</span> <span id="object-name">물체</span></h3>
                <div class="object-preview">
                    <div class="object-icon" id="preview-icon">📦</div>
                    <div class="object-name" id="preview-name">물체 이름</div>
                </div>
                <div class="measurement-info">
                    <div class="measure-item">
                        <div class="label">측정 항목</div>
                        <div class="value" id="measure-type">길이</div>
                    </div>
                    <div class="measure-item">
                        <div class="label">힌트</div>
                        <div class="value" id="measure-hint">?</div>
                    </div>
                </div>
            </div>

            <div id="game-area">
                <div id="question-display">
                    <div id="question-text">이 물체의 길이는 얼마일까요?</div>
                    <div class="answer-input-group">
                        <input type="number" id="answer-input" placeholder="?" autocomplete="off">
                        <select id="unit-selector">
                            <option value="cm">cm</option>
                            <option value="m">m</option>
                        </select>
                    </div>
                </div>
                <div id="action-buttons">
                    <button class="action-btn hint" id="hint-btn">💡 힌트</button>
                    <button class="action-btn submit" id="submit-btn">✓ 제출하기</button>
                </div>
            </div>

            <div id="hint-display"></div>

            <div id="unit-reference">
                <h4>📐 단위 변환 참고</h4>
                <div class="unit-row"><span>1 m</span><span>=</span><span>100 cm</span></div>
                <div class="unit-row"><span>1 kg</span><span>=</span><span>1000 g</span></div>
                <div class="unit-row"><span>1 L</span><span>=</span><span>1000 mL</span></div>
            </div>

            <div id="progress-container">
                <div id="progress-bar">
                    <div id="progress-fill" style="width: 0%"></div>
                </div>
                <div id="progress-text">진행률: 0%</div>
            </div>
        </div>

        <div id="feedback-message"></div>

        <div id="start-screen">
            <div class="floating-tools">
                <div class="tool" style="top: 10%; left: 10%; animation-delay: 0s;">📏</div>
                <div class="tool" style="top: 60%; left: 5%; animation-delay: 2s;">⚖️</div>
                <div class="tool" style="top: 20%; right: 15%; animation-delay: 4s;">🧪</div>
                <div class="tool" style="bottom: 15%; right: 10%; animation-delay: 6s;">📐</div>
                <div class="tool" style="bottom: 30%; left: 20%; animation-delay: 8s;">🔬</div>
            </div>
            <h1>🔬 측정 연구소 3D</h1>
            <p class="subtitle">측정 연구소에 오신 것을 환영합니다! 3D 물체를 관찰하고 길이, 무게, 부피를 측정하는 방법을 배워보세요!</p>
            <button id="start-btn">
                <span>연구 시작!</span>
                <span>🚀</span>
            </button>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">📏</div>
                    <div class="feature-title">길이 측정</div>
                    <div class="feature-desc">cm와 m로 길이를 측정해요</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚖️</div>
                    <div class="feature-title">무게 측정</div>
                    <div class="feature-desc">g과 kg으로 무게를 재요</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🧪</div>
                    <div class="feature-title">부피 측정</div>
                    <div class="feature-desc">mL와 L로 부피를 측정해요</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
    <script>
        // Measurement objects data
        const objectsData = {
            length: {
                easy: [
                    { name: '연필', icon: '✏️', type: 'cylinder', value: 15, unit: 'cm', color: 0xffeb3b },
                    { name: '지우개', icon: '🧽', type: 'box', value: 5, unit: 'cm', color: 0xff69b4 },
                    { name: '책', icon: '📕', type: 'box', value: 25, unit: 'cm', color: 0x2196f3 },
                    { name: '자', icon: '📏', type: 'box', value: 30, unit: 'cm', color: 0x9c27b0 },
                    { name: '크레파스', icon: '🖍️', type: 'cylinder', value: 8, unit: 'cm', color: 0xff5722 }
                ],
                medium: [
                    { name: '책상', icon: '🪑', type: 'box', value: 120, unit: 'cm', color: 0x795548 },
                    { name: '문', icon: '🚪', type: 'box', value: 2, unit: 'm', color: 0x607d8b },
                    { name: '창문', icon: '🪟', type: 'box', value: 100, unit: 'cm', color: 0x03a9f4 },
                    { name: '칠판', icon: '📋', type: 'box', value: 3, unit: 'm', color: 0x4caf50 },
                    { name: '의자', icon: '🪑', type: 'box', value: 45, unit: 'cm', color: 0x8bc34a }
                ],
                hard: [
                    { name: '교실', icon: '🏫', type: 'box', value: 8, unit: 'm', color: 0xff9800 },
                    { name: '운동장', icon: '🏃', type: 'box', value: 100, unit: 'm', color: 0x4caf50 },
                    { name: '수영장', icon: '🏊', type: 'box', value: 25, unit: 'm', color: 0x00bcd4 },
                    { name: '농구장', icon: '🏀', type: 'box', value: 28, unit: 'm', color: 0xff5722 },
                    { name: '축구장', icon: '⚽', type: 'box', value: 105, unit: 'm', color: 0x8bc34a }
                ]
            },
            weight: {
                easy: [
                    { name: '사과', icon: '🍎', type: 'sphere', value: 200, unit: 'g', color: 0xf44336 },
                    { name: '바나나', icon: '🍌', type: 'cylinder', value: 150, unit: 'g', color: 0xffeb3b },
                    { name: '달걀', icon: '🥚', type: 'sphere', value: 60, unit: 'g', color: 0xfff8e1 },
                    { name: '오렌지', icon: '🍊', type: 'sphere', value: 180, unit: 'g', color: 0xff9800 },
                    { name: '딸기', icon: '🍓', type: 'sphere', value: 15, unit: 'g', color: 0xe91e63 }
                ],
                medium: [
                    { name: '물병 500mL', icon: '🧴', type: 'cylinder', value: 500, unit: 'g', color: 0x2196f3 },
                    { name: '노트북', icon: '💻', type: 'box', value: 2, unit: 'kg', color: 0x9e9e9e },
                    { name: '책가방', icon: '🎒', type: 'box', value: 3, unit: 'kg', color: 0x3f51b5 },
                    { name: '수박', icon: '🍉', type: 'sphere', value: 5, unit: 'kg', color: 0x4caf50 },
                    { name: '쌀 한 포대', icon: '🌾', type: 'box', value: 10, unit: 'kg', color: 0xffc107 }
                ],
                hard: [
                    { name: '어린이 몸무게', icon: '🧒', type: 'cylinder', value: 30, unit: 'kg', color: 0xff9800 },
                    { name: '자전거', icon: '🚲', type: 'box', value: 15, unit: 'kg', color: 0x607d8b },
                    { name: '강아지', icon: '🐕', type: 'sphere', value: 8, unit: 'kg', color: 0x8d6e63 },
                    { name: '세탁기', icon: '🧺', type: 'box', value: 70, unit: 'kg', color: 0xffffff },
                    { name: '피아노', icon: '🎹', type: 'box', value: 300, unit: 'kg', color: 0x212121 }
                ]
            },
            volume: {
                easy: [
                    { name: '물컵', icon: '🥛', type: 'cylinder', value: 200, unit: 'mL', color: 0x81d4fa },
                    { name: '주스 팩', icon: '🧃', type: 'box', value: 200, unit: 'mL', color: 0xff7043 },
                    { name: '요구르트', icon: '🥛', type: 'cylinder', value: 65, unit: 'mL', color: 0xffffff },
                    { name: '약병', icon: '💊', type: 'cylinder', value: 100, unit: 'mL', color: 0x4caf50 },
                    { name: '물통', icon: '🫙', type: 'cylinder', value: 500, unit: 'mL', color: 0x03a9f4 }
                ],
                medium: [
                    { name: '우유 1팩', icon: '🥛', type: 'box', value: 1, unit: 'L', color: 0xffffff },
                    { name: '물통 큰 것', icon: '🫙', type: 'cylinder', value: 2, unit: 'L', color: 0x29b6f6 },
                    { name: '음료수 페트병', icon: '🍾', type: 'cylinder', value: 1500, unit: 'mL', color: 0x795548 },
                    { name: '샴푸통', icon: '🧴', type: 'cylinder', value: 500, unit: 'mL', color: 0xe91e63 },
                    { name: '식용유', icon: '🫒', type: 'cylinder', value: 900, unit: 'mL', color: 0xffc107 }
                ],
                hard: [
                    { name: '생수통', icon: '💧', type: 'box', value: 18, unit: 'L', color: 0x0288d1 },
                    { name: '어항', icon: '🐟', type: 'box', value: 40, unit: 'L', color: 0x00bcd4 },
                    { name: '욕조', icon: '🛁', type: 'box', value: 200, unit: 'L', color: 0xffffff },
                    { name: '세탁기 물', icon: '🧺', type: 'cylinder', value: 50, unit: 'L', color: 0x4fc3f7 },
                    { name: '수영장 어린이용', icon: '🏊', type: 'box', value: 1000, unit: 'L', color: 0x0097a7 }
                ]
            }
        };

        const unitConversions = {
            length: { cm: 1, m: 100 },
            weight: { g: 1, kg: 1000 },
            volume: { mL: 1, L: 1000 }
        };

        const unitOptions = {
            length: ['cm', 'm'],
            weight: ['g', 'kg'],
            volume: ['mL', 'L']
        };

        // Game state
        let currentCategory = 'length';
        let currentDifficulty = 'easy';
        let currentObject = null;
        let score = 0;
        let level = 1;
        let correctCount = 0;
        let totalQuestions = 0;
        let hintsUsed = 0;
        let categoryProgress = { length: 0, weight: 0, volume: 0 };
        let gameStarted = false;

        // Three.js
        let scene, camera, renderer;
        let currentMesh = null;
        let labObjects = [];
        let particles = null;
        let ruler = null;
        let measurementIndicators = [];

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1e1b4b, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setupLighting();
            createLabEnvironment();
            createParticles();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLighting() {
            const ambient = new THREE.AmbientLight(0x404080, 0.5);
            scene.add(ambient);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 20, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);

            const purpleLight = new THREE.PointLight(0x8b5cf6, 0.6, 40);
            purpleLight.position.set(-10, 10, 10);
            scene.add(purpleLight);

            const cyanLight = new THREE.PointLight(0x06b6d4, 0.6, 40);
            cyanLight.position.set(10, 5, -10);
            scene.add(cyanLight);

            const accentLight = new THREE.PointLight(0xfbbf24, 0.4, 30);
            accentLight.position.set(0, -5, 15);
            scene.add(accentLight);
        }

        function createLabEnvironment() {
            // Lab table
            const tableGeometry = new THREE.BoxGeometry(20, 0.5, 10);
            const tableMaterial = new THREE.MeshPhongMaterial({
                color: 0x4a4458,
                shininess: 40
            });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.y = -3;
            table.receiveShadow = true;
            scene.add(table);

            // Ruler on table
            const rulerGeometry = new THREE.BoxGeometry(8, 0.1, 1.5);
            const rulerMaterial = new THREE.MeshPhongMaterial({
                color: 0x9c27b0,
                transparent: true,
                opacity: 0.7
            });
            ruler = new THREE.Mesh(rulerGeometry, rulerMaterial);
            ruler.position.set(-4, -2.7, 3);
            scene.add(ruler);

            // Scale
            const scaleBase = new THREE.Mesh(
                new THREE.CylinderGeometry(1.5, 1.5, 0.3, 32),
                new THREE.MeshPhongMaterial({ color: 0x607d8b })
            );
            scaleBase.position.set(5, -2.6, 2);
            scene.add(scaleBase);

            // Beakers
            const beakerColors = [0x81d4fa, 0xffab91, 0xce93d8];
            for (let i = 0; i < 3; i++) {
                const beaker = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.3, 1.5, 16, 1, true),
                    new THREE.MeshPhongMaterial({
                        color: beakerColors[i],
                        transparent: true,
                        opacity: 0.6,
                        side: THREE.DoubleSide
                    })
                );
                beaker.position.set(-6 + i * 1.2, -2, -2);
                scene.add(beaker);
            }

            // Floating measurement tools
            const tools = [
                { geom: new THREE.BoxGeometry(3, 0.2, 0.8), color: 0x9c27b0, pos: [-8, 3, -5] },
                { geom: new THREE.CylinderGeometry(0.8, 0.8, 0.3, 32), color: 0x4caf50, pos: [8, 4, -6] },
                { geom: new THREE.CylinderGeometry(0.3, 0.25, 1.2, 16), color: 0x2196f3, pos: [-7, 5, -4] }
            ];

            tools.forEach((tool, i) => {
                const mesh = new THREE.Mesh(tool.geom, new THREE.MeshPhongMaterial({
                    color: tool.color,
                    transparent: true,
                    opacity: 0.5
                }));
                mesh.position.set(...tool.pos);
                mesh.userData = {
                    originalY: tool.pos[1],
                    floatSpeed: 0.003 + Math.random() * 0.002,
                    rotationSpeed: 0.005 + Math.random() * 0.005
                };
                scene.add(mesh);
                labObjects.push(mesh);
            });
        }

        function createParticles() {
            const particleCount = 100;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 40;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 30;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 30;

                const colorChoice = Math.random();
                if (colorChoice < 0.33) {
                    colors[i * 3] = 0.55; colors[i * 3 + 1] = 0.36; colors[i * 3 + 2] = 0.96;
                } else if (colorChoice < 0.66) {
                    colors[i * 3] = 0.02; colors[i * 3 + 1] = 0.71; colors[i * 3 + 2] = 0.83;
                } else {
                    colors[i * 3] = 0.98; colors[i * 3 + 1] = 0.75; colors[i * 3 + 2] = 0.14;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function createMeasurementObject(objectData) {
            if (currentMesh) {
                scene.remove(currentMesh);
            }
            measurementIndicators.forEach(ind => scene.remove(ind));
            measurementIndicators = [];

            let geometry;
            const scale = Math.min(3, Math.max(0.5, objectData.value / 50));

            switch (objectData.type) {
                case 'box':
                    geometry = new THREE.BoxGeometry(scale * 1.5, scale, scale);
                    break;
                case 'sphere':
                    geometry = new THREE.SphereGeometry(scale * 0.8, 32, 32);
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(scale * 0.4, scale * 0.4, scale * 1.5, 32);
                    break;
                default:
                    geometry = new THREE.BoxGeometry(scale, scale, scale);
            }

            const material = new THREE.MeshPhongMaterial({
                color: objectData.color,
                shininess: 60,
                emissive: objectData.color,
                emissiveIntensity: 0.1
            });

            currentMesh = new THREE.Mesh(geometry, material);
            currentMesh.position.set(0, 0, 0);
            currentMesh.castShadow = true;
            currentMesh.userData = { startScale: 0 };
            
            // Animate scale in
            currentMesh.scale.set(0.01, 0.01, 0.01);
            
            scene.add(currentMesh);

            // Add measurement arrows for length
            if (currentCategory === 'length') {
                createMeasurementArrows(scale);
            }
        }

        function createMeasurementArrows(scale) {
            const arrowMaterial = new THREE.LineBasicMaterial({ color: 0xfbbf24 });
            
            // Horizontal arrow
            const points = [
                new THREE.Vector3(-scale, -scale, scale),
                new THREE.Vector3(scale, -scale, scale)
            ];
            const arrowGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const arrow = new THREE.Line(arrowGeometry, arrowMaterial);
            scene.add(arrow);
            measurementIndicators.push(arrow);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Rotate current object
            if (currentMesh) {
                currentMesh.rotation.y += 0.005;
                
                // Animate scale in
                if (currentMesh.scale.x < 1) {
                    currentMesh.scale.x += 0.05;
                    currentMesh.scale.y += 0.05;
                    currentMesh.scale.z += 0.05;
                }
            }

            // Animate floating lab objects
            labObjects.forEach(obj => {
                obj.position.y = obj.userData.originalY + Math.sin(time * obj.userData.floatSpeed * 100) * 0.3;
                obj.rotation.y += obj.userData.rotationSpeed;
            });

            // Animate particles
            if (particles) {
                particles.rotation.y += 0.0003;
            }

            renderer.render(scene, camera);
        }

        function generateQuestion() {
            const objects = objectsData[currentCategory][currentDifficulty];
            currentObject = objects[Math.floor(Math.random() * objects.length)];
            
            createMeasurementObject(currentObject);
            displayQuestion();
            updateUnitSelector();
            updateObjectPanel();
        }

        function displayQuestion() {
            let questionType;
            switch (currentCategory) {
                case 'length': questionType = '길이'; break;
                case 'weight': questionType = '무게'; break;
                case 'volume': questionType = '부피'; break;
            }

            document.getElementById('question-text').textContent = 
                `이 ${currentObject.name}의 ${questionType}는 얼마일까요?`;
            
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
        }

        function updateUnitSelector() {
            const selector = document.getElementById('unit-selector');
            const units = unitOptions[currentCategory];
            
            selector.innerHTML = '';
            units.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit;
                option.textContent = unit;
                selector.appendChild(option);
            });
        }

        function updateObjectPanel() {
            document.getElementById('object-icon').textContent = currentObject.icon;
            document.getElementById('object-name').textContent = currentObject.name;
            document.getElementById('preview-icon').textContent = currentObject.icon;
            document.getElementById('preview-name').textContent = currentObject.name;
            
            let measureType;
            switch (currentCategory) {
                case 'length': measureType = '길이'; break;
                case 'weight': measureType = '무게'; break;
                case 'volume': measureType = '부피'; break;
            }
            document.getElementById('measure-type').textContent = measureType;
            document.getElementById('measure-hint').textContent = '?';
        }

        function submitAnswer() {
            const userValue = parseFloat(document.getElementById('answer-input').value);
            const userUnit = document.getElementById('unit-selector').value;

            if (isNaN(userValue)) {
                showFeedback('❓ 숫자를 입력하세요!', '#fbbf24');
                return;
            }

            // Convert user answer to base unit
            const baseConversion = unitConversions[currentCategory];
            const userInBase = userValue * baseConversion[userUnit];
            const correctInBase = currentObject.value * baseConversion[currentObject.unit];

            // Allow 10% tolerance
            const tolerance = correctInBase * 0.1;
            const isCorrect = Math.abs(userInBase - correctInBase) <= tolerance;

            totalQuestions++;

            if (isCorrect) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }
        }

        function handleCorrectAnswer() {
            correctCount++;
            categoryProgress[currentCategory]++;

            // Calculate score
            const difficultyBonus = { easy: 50, medium: 75, hard: 100 }[currentDifficulty];
            const hintPenalty = hintsUsed * 10;
            const points = Math.max(difficultyBonus - hintPenalty, 10);
            score += points;

            showFeedback('🎉 정답!', '#10b981');
            createConfetti();

            document.getElementById('score').textContent = score;
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('total-count').textContent = totalQuestions;
            updateCategoryProgress();

            // Level up
            if (correctCount % 5 === 0) {
                level++;
                document.getElementById('level').textContent = level;
            }

            // Reset hints
            hintsUsed = 0;
            document.getElementById('hint-display').classList.remove('show');

            setTimeout(generateQuestion, 1200);
        }

        function handleWrongAnswer() {
            const correctDisplay = `${currentObject.value} ${currentObject.unit}`;
            showFeedback(`❌ 정답: ${correctDisplay}`, '#ef4444');
            
            score = Math.max(0, score - 10);
            document.getElementById('score').textContent = score;
            document.getElementById('total-count').textContent = totalQuestions;
        }

        function showHint() {
            const value = currentObject.value;
            const unit = currentObject.unit;
            
            let hintText;
            if (hintsUsed === 0) {
                // First hint: range
                const lower = Math.round(value * 0.7);
                const upper = Math.round(value * 1.3);
                hintText = `💡 ${lower}~${upper} ${unit} 사이예요!`;
            } else {
                // Second hint: closer range
                const lower = Math.round(value * 0.9);
                const upper = Math.round(value * 1.1);
                hintText = `💡 ${lower}~${upper} ${unit} 사이예요!`;
            }

            document.getElementById('hint-display').textContent = hintText;
            document.getElementById('hint-display').classList.add('show');
            document.getElementById('measure-hint').textContent = `${Math.round(value * 0.8)}~`;

            hintsUsed++;
            score = Math.max(0, score - 5);
            document.getElementById('score').textContent = score;
        }

        function selectCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            
            generateQuestion();
        }

        function selectDifficulty(difficulty) {
            currentDifficulty = difficulty;
            
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === difficulty);
            });
            
            generateQuestion();
        }

        function updateCategoryProgress() {
            document.getElementById('length-progress').textContent = `${categoryProgress.length}/5`;
            document.getElementById('weight-progress').textContent = `${categoryProgress.weight}/5`;
            document.getElementById('volume-progress').textContent = `${categoryProgress.volume}/5`;

            // Update progress bar
            const totalProgress = categoryProgress.length + categoryProgress.weight + categoryProgress.volume;
            const maxProgress = 15;
            const percent = Math.round((totalProgress / maxProgress) * 100);
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-text').textContent = `진행률: ${percent}%`;
        }

        function showFeedback(message, color) {
            const feedback = document.getElementById('feedback-message');
            feedback.innerHTML = message;
            feedback.style.color = color;
            feedback.style.textShadow = `0 0 40px ${color}`;
            feedback.classList.add('show');

            setTimeout(() => {
                feedback.classList.remove('show');
            }, 1500);
        }

        function createConfetti() {
            const colors = ['#8b5cf6', '#06b6d4', '#fbbf24', '#10b981', '#f43f5e'];
            
            for (let i = 0; i < 20; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Event listeners
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.opacity = '0';
            document.getElementById('start-screen').style.transition = 'opacity 0.5s';
            
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                gameStarted = true;
                initThreeJS();
                generateQuestion();
            }, 500);
        });

        document.getElementById('submit-btn').addEventListener('click', submitAnswer);
        document.getElementById('hint-btn').addEventListener('click', showHint);

        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitAnswer();
        });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => selectCategory(btn.dataset.category));
        });

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => selectDifficulty(btn.dataset.diff));
        });
    </script>
</body>
</html>
