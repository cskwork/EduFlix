<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Builder character with hard hat -->
  <circle cx="50" cy="55" r="35" fill="#FFD54F" stroke="#F57F17" stroke-width="2"/>
  <!-- Hard hat -->
  <ellipse cx="50" cy="28" rx="30" ry="12" fill="#FFA726"/>
  <rect x="20" y="22" width="60" height="12" rx="3" fill="#FF9800"/>
  <!-- Eyes -->
  <circle cx="38" cy="50" r="4" fill="#333"/>
  <circle cx="62" cy="50" r="4" fill="#333"/>
  <!-- Smile -->
