<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <!-- Category boxes -->
  <rect x="30" y="60" width="100" height="80" rx="8" fill="#4ade80" opacity="0.3"/>
  <rect x="150" y="60" width="100" height="80" rx="8" fill="#fbbf24" opacity="0.3"/>
  <rect x="270" y="60" width="100" height="80" rx="8" fill="#f472b6" opacity="0.3"/>
  <!-- Labels -->
  <text x="80" y="105" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold">Move</text>
  <text x="200" y="105" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold">Make</text>
  <text x="320" y="105" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="14" font-weight="bold">Feel</text>
  <!-- Verb cards -->
  <rect x="60" y="160" width="70" height="40" rx="6" fill="#334155"/>
  <text x="95" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16">run</text>
  <rect x="165" y="160" width="70" height="40" rx="6" fill="#334155"/>
  <text x="200" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16">draw</text>
  <rect x="270" y="160" width="70" height="40" rx="6" fill="#334155"/>
  <text x="305" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16">love</text>
  <!-- Title -->
  <text x="200" y="35" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="bold">Action Verbs</text>
</svg>
