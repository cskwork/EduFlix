<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Safari</title>
  <link rel="stylesheet" href="../../../common/style.css">
  <style>
    /* Content Specific */
    .safari-scene {
        width: 100%;
        height: 100%;
        background: #f0f8ff; /* AliceBlue */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    
    .card-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 20px;
    }
    
    .word-card {
        width: 150px;
        height: 200px;
        background: white;
        border: 2px solid #ccc;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
        padding: 10px;
    }
    
    .word-card:hover {
        transform: translateY(-5px);
        border-color: #ff9800;
    }
    
    .card-image {
        font-size: 60px;
        margin-bottom: 20px;
    }
    
    .card-word {
        font-size: 20px;
        font-weight: bold;
        color: #333;
    }
    
    .hidden-word {
        color: transparent;
        border-bottom: 2px solid #333;
    }
    
    .word-card.revealed .hidden-word {
        color: #333;
        border-bottom: none;
    }
    
    .match-target {
        font-size: 2rem;
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 20px;
        padding: 10px 30px;
        background: #e0f7fa;
        border-radius: 20px;
    }

    #safari-bg {
        position: absolute;
        top:0; left:0; width:100%; height:100%;
        z-index: -1;
        opacity: 0.1;
        background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="%234caf50"/></svg>');
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  <script src="../../../common/engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
