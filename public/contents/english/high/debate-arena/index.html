<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debate Arena</title>
  <link rel="stylesheet" href="../../../common/style.css">
  <style>
    /* Debate Specific */
    .arena-bg {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #f3e5f5, #e1bee7);
        padding: 20px;
        border-radius: 8px;
        text-align: center;
    }
    
    .topic-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    
    .topic-text {
        font-size: 1.5rem;
        font-weight: bold;
        color: #4a148c;
    }
    
    .argument-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .argument-bubble {
        background: white;
        padding: 15px;
        border-radius: 20px;
        border-bottom-left-radius: 0;
        text-align: left;
        cursor: pointer;
        transition: transform 0.2s;
        border: 2px solid transparent;
    }
    
    .argument-bubble:hover {
        transform: translateX(10px);
        border-color: #9c27b0;
    }
    
    .argument-bubble.pro {
        border-left: 5px solid #4caf50;
    }
    
    .argument-bubble.con {
        border-left: 5px solid #f44336;
    }
    
    .placeholder {
        height: 60px;
        border: 2px dashed #999;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #777;
    }
    
    .drop-zone {
        background: #e8eaf6;
        padding: 20px;
        border-radius: 10px;
        min-height: 200px;
    }

  </style>
</head>
<body>
  <div id="scene-container"></div>
  <script src="../../../common/engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
